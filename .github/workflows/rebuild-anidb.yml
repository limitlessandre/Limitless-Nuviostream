            .anidb-cffi-probe.txt \
            .anidb-playback-probe.txt \
            .github/workflows/probe-anidb.yml \
            .github/workflows/probe-anidb-headers.yml \
            .github/workflows/probe-anidb-index.yml \
            .github/workflows/probe-anidb-cffi.yml \
            .github/workflows/probe-anidb-playback.yml \
            .github/workflows/rebuild-anidb.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers/anidb.js manifest.json sources-lock.json README.md .github/workflows .anidb-*.txt
          git commit -m "Rebuild AniDB around frozen exact index [skip ci]"
          git push origin HEAD:Limitless-Nuviotest
