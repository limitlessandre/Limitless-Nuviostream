name: Rebuild AniDB without runtime Cloudflare search

on:
  push:
    branches: [Limitless-Nuviotest]
    paths:
      - .github/workflows/rebuild-anidb.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate frozen AniDB title index and clean provider
        shell: bash
        run: |
          set -euo pipefail
          pip install -q curl_cffi beautifulsoup4
          python3 - <<'PY'
          import json, re, time, unicodedata
          from pathlib import Path
          from bs4 import BeautifulSoup
          from curl_cffi import requests

          BASE = 'https://anidb.app'
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          session = requests.Session(impersonate='chrome')

          def norm(value):
              s = unicodedata.normalize('NFKD', str(value or ''))
              s = ''.join(ch for ch in s if unicodedata.category(ch) != 'Mn').lower().replace('&', ' and ')
              s = re.sub(r'[^a-z0-9\u3040-\u30ff\u3400-\u9fff]+', ' ', s)
              return re.sub(r'\s+', ' ', s).strip()

          def get_page(page):
              url = f'{BASE}/browse?page={page}'
              for attempt in range(4):
                  r = session.get(url, headers={'User-Agent':UA,'Referer':BASE+'/'}, timeout=25)
                  if r.status_code == 200 and 'Just a moment' not in r.text and 'anime-card' in r.text:
                      return r.text
                  time.sleep(1 + attempt)
              raise RuntimeError(f'Could not read AniDB browse page {page}: {r.status_code}')

          first = get_page(1)
          m = re.search(r'Page\s+1\s+of\s+(\d+)', first, re.I)
          if not m:
              raise SystemExit('Could not determine AniDB browse page count')
          pages = int(m.group(1))
          if pages < 250 or pages > 500:
              raise SystemExit(f'Unexpected AniDB page count: {pages}')

          by_id = {}
          def collect(html):
              soup = BeautifulSoup(html, 'html.parser')
              for a in soup.select('a.anime-card'):
                  href = a.get('href') or ''
                  mm = re.search(r'/anime/([^/?#]+)-(\d+)(?:[/?#]|$)', href)
                  if not mm:
                      continue
                  slug_title, sid = mm.group(1), int(mm.group(2))
                  title = (a.get('title') or '').strip()
                  if not title:
                      p = a.find('p')
                      if p: title = p.get_text(' ', strip=True)
                  if not title:
                      img = a.find('img')
                      if img: title = (img.get('alt') or '').strip()
                  if not title:
                      title = slug_title.replace('-', ' ')
                  by_id[sid] = (title, slug_title)

          collect(first)
          for page in range(2, pages + 1):
              collect(get_page(page))
              if page % 25 == 0:
                  print(f'Indexed page {page}/{pages}: {len(by_id)} titles')
              time.sleep(0.08)

          if len(by_id) < 6000:
              raise SystemExit(f'AniDB index unexpectedly small: {len(by_id)}')

          buckets = {}
          for sid, (title, slug_title) in sorted(by_id.items()):
              for key in {norm(title), norm(slug_title.replace('-', ' '))}:
                  if not key: continue
                  buckets.setdefault(key, []).append(sid)

          index = {}
          for key, ids in buckets.items():
              ids = sorted(set(ids))
              index[key] = ids[0] if len(ids) == 1 else ids

          def ids_for(key):
              v = index.get(norm(key))
              return [v] if isinstance(v, int) else (v or [])

          if 4517 not in ids_for('Saga of Tanya the Evil'):
              raise SystemExit('Tanya identity missing from generated AniDB index')
          if 1663 not in ids_for("Frieren: Beyond Journey's End"):
              raise SystemExit('Frieren identity missing from generated AniDB index')

          index_json = json.dumps(index, ensure_ascii=False, separators=(',', ':'), sort_keys=True)
          print(f'Generated {len(by_id)} AniDB IDs / {len(index)} exact normalized keys / {len(index_json)} bytes')

          template = r'''"use strict";

// Limitless-maintained AniDB.app provider.
// AniDB.app protects its HTML search with Cloudflare, while its episode/language
// JSON APIs and playback embeds remain directly accessible. To keep Nuvio fast
// and deterministic, this provider uses a frozen exact title -> site ID index
// generated from AniDB.app browse pages at maintenance time. Runtime scraping
// never attempts to bypass Cloudflare.

const NAME = "AniDB";
const BASE = "https://anidb.app";
const TMDB_KEY = "1865f43a0549ca50d341dd9ab8b29f49";
const MAP = "https://id-mapping-api-malid.hf.space/api/resolve";
const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
const SITE_INDEX = __INDEX__;

const HEADERS = {
  "User-Agent": UA,
  "Accept": "*/*",
  "Accept-Language": "en-US,en;q=0.9"
};

const PLAYBACK_HEADERS = {
  "User-Agent": UA,
  "Referer": BASE + "/",
  "Origin": BASE
};

async function request(url, options = {}, timeout = 15000) {
  const signal = typeof AbortSignal !== "undefined" && AbortSignal.timeout
    ? AbortSignal.timeout(timeout)
    : undefined;
  const response = await fetch(url, {
    ...options,
    headers: { ...HEADERS, ...(options.headers || {}) },
    signal,
    skipSizeCheck: true
  });
  if (!response || !response.ok) {
    throw new Error(`HTTP ${response ? response.status : "?"} ${url}`);
  }
  return response;
}

async function getJson(url, options = {}, timeout) {
  try {
    return await (await request(url, options, timeout)).json();
  } catch (error) {
    console.log(`[${NAME}] ${error.message}`);
    return null;
  }
}

async function getText(url, options = {}, timeout) {
  try {
    return await (await request(url, options, timeout)).text();
  } catch (error) {
    console.log(`[${NAME}] ${error.message}`);
    return null;
  }
}

function normalize(value) {
  return String(value || "")
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/&/g, " and ")
    .replace(/[^a-z0-9\u3040-\u30ff\u3400-\u9fff]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function unique(values) {
  const out = [];
  const seen = new Set();
  for (const value of values || []) {
    if (!value) continue;
    const text = String(value).trim();
    const key = normalize(text);
    if (!key || seen.has(key)) continue;
    seen.add(key);
    out.push(text);
  }
  return out;
}

function normalizedMediaType(type) {
  return String(type || "tv").toLowerCase() === "movie" ? "movie" : "tv";
}

async function resolveTmdbId(inputId, type) {
  const raw = String(inputId || "").trim();
  if (/^\d+$/.test(raw)) return parseInt(raw, 10);
  if (!/^tt\d+$/i.test(raw)) return null;
  const data = await getJson(
    `https://api.themoviedb.org/3/find/${encodeURIComponent(raw)}?api_key=${TMDB_KEY}&external_source=imdb_id`
  );
  const list = type === "movie" ? data && data.movie_results : data && data.tv_results;
  return Array.isArray(list) && list[0] && list[0].id ? parseInt(list[0].id, 10) : null;
}

async function tmdbInfo(id, type) {
  const data = await getJson(
    `https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_KEY}&append_to_response=external_ids,alternative_titles`
  );
  if (!data) return null;
  const altBlock = data.alternative_titles || {};
  const alt = type === "movie" ? altBlock.titles : altBlock.results;
  return {
    title: type === "movie" ? (data.title || data.original_title) : (data.name || data.original_name),
    original: type === "movie" ? data.original_title : data.original_name,
    imdb: (data.external_ids && data.external_ids.imdb_id) || data.imdb_id || null,
    genres: Array.isArray(data.genres) ? data.genres.map(x => x.id) : [],
    alternatives: Array.isArray(alt) ? alt.map(x => x && x.title).filter(Boolean).slice(0, 16) : []
  };
}

async function malEpisodeMap(imdb, season, episode) {
  if (!imdb) return null;
  return await getJson(
    `${MAP}?id=${encodeURIComponent(imdb)}&s=${encodeURIComponent(season)}&e=${encodeURIComponent(episode)}`,
    {},
    15000
  );
}

async function jikanAliases(malId) {
  if (!malId) return [];
  const data = await getJson(`https://api.jikan.moe/v4/anime/${encodeURIComponent(malId)}`, {}, 15000);
  const anime = data && data.data;
  if (!anime) return [];
  return unique([
    anime.title,
    anime.title_english,
    anime.title_japanese,
    ...(Array.isArray(anime.title_synonyms) ? anime.title_synonyms : []),
    ...(Array.isArray(anime.titles) ? anime.titles.map(x => x && x.title) : [])
  ]);
}

async function aniListAliases(malId) {
  if (!malId) return [];
  const query = `query($idMal:Int){Media(idMal:$idMal,type:ANIME){title{english romaji native} synonyms}}`;
  const data = await getJson("https://graphql.anilist.co", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, variables: { idMal: parseInt(malId, 10) } })
  }, 15000);
  const media = data && data.data && data.data.Media;
  if (!media) return [];
  return unique([
    media.title && media.title.english,
    media.title && media.title.romaji,
    media.title && media.title.native,
    ...(Array.isArray(media.synonyms) ? media.synonyms : [])
  ]);
}

async function buildAliases(tmdb, mapping) {
  const malId = mapping && mapping.mal_id ? parseInt(mapping.mal_id, 10) : null;
  const extra = malId
    ? await Promise.all([jikanAliases(malId), aniListAliases(malId)])
    : [[], []];
  return unique([
    mapping && mapping.anime_title,
    ...extra[0],
    ...extra[1],
    tmdb && tmdb.title,
    tmdb && tmdb.original,
    ...(tmdb && Array.isArray(tmdb.alternatives) ? tmdb.alternatives : [])
  ]).slice(0, 32);
}

function candidateIds(aliases) {
  const out = [];
  const seen = new Set();
  for (const alias of aliases || []) {
    const key = normalize(alias);
    const value = SITE_INDEX[key];
    const ids = Array.isArray(value) ? value : (Number.isFinite(value) ? [value] : []);
    for (const id of ids) {
      if (seen.has(id)) continue;
      seen.add(id);
      out.push({ id, alias });
    }
  }
  return out;
}

async function episodeList(siteId) {
  const data = await getJson(`${BASE}/api/frontend/anime/${encodeURIComponent(siteId)}/episodes`, {
    headers: { "Referer": BASE + "/", "X-Requested-With": "XMLHttpRequest" }
  });
  return data && Array.isArray(data.episodes) ? data.episodes : [];
}

function chooseEpisode(episodes, targetNumber) {
  const target = Number(targetNumber);
  if (!Number.isFinite(target)) return null;
  let exact = episodes.find(ep => Number(ep && ep.number) === target);
  if (exact) return exact;
  const numbers = episodes.map(ep => Number(ep && ep.number)).filter(n => Number.isFinite(n));
  if (!numbers.length) return null;
  const min = Math.min(...numbers);
  if (min > 1) {
    const shifted = min + target - 1;
    exact = episodes.find(ep => Number(ep && ep.number) === shifted);
    if (exact) return exact;
  }
  return null;
}

async function languageList(episodeId) {
  const data = await getJson(`${BASE}/api/frontend/episode/${encodeURIComponent(episodeId)}/languages`, {
    headers: { "Referer": BASE + "/", "X-Requested-With": "XMLHttpRequest" }
  });
  return data && Array.isArray(data.languages) ? data.languages : [];
}

function languageKind(item) {
  const code = String(item && (item.code || item.name) || "").toLowerCase();
  if (["eng", "en", "english"].includes(code)) return "dub";
  if (["jpn", "ja", "japanese"].includes(code)) return "hard";
  return null;
}

function extractMaster(html, embedUrl) {
  const patterns = [
    /sources\s*:\s*\[\s*\{[^}]*file\s*:\s*["']([^"']+\.m3u8[^"']*)["']/i,
    /file\s*:\s*["']([^"']+\.m3u8[^"']*)["']/i,
    /["'](https?:\/\/[^"']+\/master\.m3u8[^"']*)["']/i,
    /["'](https?:\/\/[^"']+\.m3u8[^"']*)["']/i
  ];
  for (const pattern of patterns) {
    const match = String(html || "").match(pattern);
    if (!match || !match[1]) continue;
    const raw = match[1].replace(/\\\//g, "/").replace(/&amp;/g, "&");
    try { return new URL(raw, embedUrl).href; } catch (_) { return raw; }
  }
  return null;
}

async function inspectMaster(url) {
  const body = await getText(url, { headers: PLAYBACK_HEADERS }, 15000);
  if (!body || !body.trim().startsWith("#EXTM3U")) return { quality: "Auto" };
  let max = 0;
  const regex = /RESOLUTION=\d+x(\d+)/gi;
  let match;
  while ((match = regex.exec(body)) !== null) {
    max = Math.max(max, parseInt(match[1], 10) || 0);
  }
  return { quality: max ? `${max}p` : "Auto" };
}

async function resolveLanguage(item, ctx) {
  const kind = languageKind(item);
  if (!kind || !item.embed_url) return null;
  const html = await getText(item.embed_url, { headers: PLAYBACK_HEADERS }, 15000);
  if (!html || /Just a moment/i.test(html)) return null;
  const master = extractMaster(html, item.embed_url);
  if (!master) return null;
  const info = await inspectMaster(master);
  const tag = kind === "dub" ? "DUB" : "HARDSUB";
  const audio = kind === "dub" ? "English" : "Japanese";
  return {
    name: `${NAME} | ${info.quality} [${tag}]`,
    title: `${ctx.title} • ${ctx.label} • ${kind === "dub" ? "English Dub" : "Japanese Hard Sub"}`,
    url: master,
    quality: info.quality,
    provider: NAME,
    type: "m3u8",
    headers: PLAYBACK_HEADERS,
    language: audio,
    subtitles: []
  };
}

async function getStreams(inputId, mediaType = "tv", season = 1, episode = 1) {
  try {
    const type = normalizedMediaType(mediaType);
    const tmdbId = await resolveTmdbId(inputId, type);
    if (!tmdbId) return [];
    const tmdb = await tmdbInfo(tmdbId, type);
    if (!tmdb || !tmdb.title) return [];
    if (tmdb.genres.length && !tmdb.genres.includes(16)) return [];

    const s = type === "movie" ? 1 : (parseInt(season, 10) || 1);
    const e = type === "movie" ? 1 : (parseFloat(episode) || 1);
    const mapping = await malEpisodeMap(tmdb.imdb, s, e);
    const aliases = await buildAliases(tmdb, mapping);
    const candidates = candidateIds(aliases);
    if (!candidates.length) {
      console.log(`[${NAME}] No exact frozen-index match for: ${aliases.join(" | ")}`);
      return [];
    }

    const target = type === "movie"
      ? 1
      : (mapping && mapping.mal_episode != null ? Number(mapping.mal_episode) : e);

    for (const candidate of candidates) {
      const episodes = await episodeList(candidate.id);
      if (!episodes.length) continue;
      const targetEpisode = type === "movie" ? episodes[0] : chooseEpisode(episodes, target);
      if (!targetEpisode || !targetEpisode.id) continue;
      const languages = await languageList(targetEpisode.id);
      if (!languages.length) continue;

      const ctx = {
        title: candidate.alias || tmdb.title,
        label: type === "movie" ? "Movie" : `S${s}E${e}`
      };
      const resolved = await Promise.all(languages.map(item => resolveLanguage(item, ctx).catch(() => null)));
      const seen = new Set();
      const streams = resolved.filter(Boolean).filter(stream => {
        const key = `${stream.url}|${stream.language}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      streams.sort((a, b) => Number(/\[DUB\]/.test(b.name)) - Number(/\[DUB\]/.test(a.name)));
      if (streams.length) {
        console.log(`[${NAME}] ${candidate.alias} -> site ${candidate.id} -> ${streams.length} stream(s)`);
        return streams;
      }
    }
    return [];
  } catch (error) {
    console.log(`[${NAME}] ${error && error.message ? error.message : error}`);
    return [];
  }
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { getStreams };
} else {
  globalThis.getStreams = getStreams;
}
'''
          provider = template.replace('__INDEX__', index_json)
          Path('providers/anidb.js').write_text(provider, encoding='utf-8')

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.1.15'
          for item in manifest.get('scrapers', []):
              if item.get('id') == 'anidb':
                  item['version'] = '1.0.2'
                  item['description'] = 'Limitless-maintained AniDB.app provider using a frozen exact title-to-site-ID index to bypass Cloudflare search at runtime, with direct JSON episode/language APIs and DUB/HARDSUB HLS streams.'
                  item['hasSettings'] = False
                  item['formats'] = ['m3u8']
                  item['contentLanguage'] = ['en', 'ja']
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          lock_path = Path('sources-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['baseline'] = 'anime-v0.1.15'
          for provider_lock in lock.get('providers', []):
              if provider_lock.get('filename') == 'anidb.js':
                  origin = provider_lock.get('upstreamOrigin') or {
                      'repository': 'NuvioPlugin/All-in-One-Nuvio',
                      'commit': '716057b2a0d55a634da88c1d0d2db7352df07c69',
                      'path': 'providers/anidb.js'
                  }
                  provider_lock.clear()
                  provider_lock.update({
                      'filename': 'anidb.js',
                      'repository': 'limitlessandre/Limitless-Nuviostream',
                      'commit': 'Limitless-Nuviotest',
                      'path': 'providers/anidb.js',
                      'maintainedLocally': True,
                      'localVersion': '1.0.2',
                      'upstreamOrigin': origin,
                      'referenceImplementations': [
                          {'repository':'yuzono/anime-extensions','commit':'1e0d69547b7ac14893b6beab80fd8c8597d091c3','path':'src/en/anidb/src/eu/kanade/tachiyomi/animeextension/en/anidb/AniDB.kt'},
                          {'repository':'pystardust/ani-cli','commit':'92e9d796d23aef3ae94b52852f9c992e2bce4fe3','path':'ani-cli'}
                      ],
                      'notes': f'Limitless clean rewrite. AniDB.app HTML search is Cloudflare-protected for normal Nuvio fetches, so runtime search is replaced by a frozen exact normalized title index generated from {len(by_id)} AniDB.app browse entries at maintenance time. Playback uses only the public episode/language JSON APIs and HLS embeds. Japanese audio is labeled HARDSUB; English audio is DUB.'
                  })
          lock_path.write_text(json.dumps(lock, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          note = '- AniDB uses a frozen exact title-to-site-ID index because anidb.app protects HTML search with Cloudflare; normal playback still uses the site public JSON/HLS endpoints directly.\n'
          if note not in readme:
              marker = '- Updates are manual so we can test a provider before changing our baseline.\n'
              readme = readme.replace(marker, marker + note)
              readme_path.write_text(readme, encoding='utf-8')
          PY

          node --check providers/anidb.js

      - name: Validate AniDB live against Tanya and Frieren
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const provider = require('./providers/anidb.js');
          async function check(id, title) {
            const out = await provider.getStreams(id, 'tv', 1, 1);
            console.log(title, JSON.stringify(out, null, 2));
            if (!Array.isArray(out) || out.length < 2) throw new Error(`${title}: expected DUB + HARDSUB`);
            if (!out.some(x => /\[DUB\]/.test(x.name))) throw new Error(`${title}: DUB missing`);
            if (!out.some(x => /\[HARDSUB\]/.test(x.name))) throw new Error(`${title}: HARDSUB missing`);
            for (const stream of out) {
              if (stream.type !== 'm3u8') throw new Error(`${title}: wrong stream type`);
              const r = await fetch(stream.url, { headers: stream.headers });
              const body = await r.text();
              console.log(`${title} ${stream.name}: ${r.status} ${r.headers.get('content-type')} ${stream.url}`);
              if (!r.ok || !body.trim().startsWith('#EXTM3U')) throw new Error(`${title}: invalid HLS`);
            }
          }
          (async()=>{
            await check('69346', 'Saga of Tanya the Evil');
            await check('209867', "Frieren: Beyond Journey's End");
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Validate repository and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
