name: Probe AniDB playback path

on:
  push:
    branches: [Limitless-Nuviotest]
    paths:
      - .github/workflows/probe-anidb-playback.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe JSON to embed to HLS
        shell: bash
        run: |
          node <<'NODE' > .anidb-playback-probe.txt 2>&1
          const H={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
            'Referer':'https://anidb.app/',
            'Origin':'https://anidb.app'
          };
          (async()=>{
            for (const ep of [26404,3062]) {
              const lr=await fetch(`https://anidb.app/api/frontend/episode/${ep}/languages`,{headers:H});
              const lj=await lr.json();
              console.log(`EP ${ep} LANG ${lr.status} ${JSON.stringify(lj)}`);
              for (const lang of (lj.languages||[]).filter(x=>['jpn','eng'].includes(x.code))) {
                try {
                  const er=await fetch(lang.embed_url,{headers:H});
                  const eh=await er.text();
                  console.log(`EMBED ${lang.code} ${er.status} ct=${er.headers.get('content-type')} len=${eh.length} challenge=${eh.includes('Just a moment')}`);
                  const m=eh.match(/file\s*:\s*['\"](https?:\/\/[^'\"]+\.m3u8[^'\"]*)['\"]/i)||eh.match(/['\"](https?:\/\/[^'\"]+\.m3u8[^'\"]*)['\"]/i);
                  console.log(`MASTER ${lang.code} ${m?m[1]:'NONE'}`);
                  if(m){
                    const mr=await fetch(m[1],{headers:H});
                    const mt=await mr.text();
                    console.log(`MASTER_FETCH ${lang.code} ${mr.status} ct=${mr.headers.get('content-type')} len=${mt.length} extm3u=${mt.startsWith('#EXTM3U')}`);
                    console.log(mt.slice(0,1500));
                    const lines=mt.split(/\r?\n/);
                    const first=lines.find(x=>x.trim()&&!x.startsWith('#'));
                    if(first){
                      const child=new URL(first,m[1]).href;
                      const cr=await fetch(child,{headers:H});
                      const ct=await cr.text();
                      console.log(`CHILD ${lang.code} ${cr.status} url=${child} ct=${cr.headers.get('content-type')} extm3u=${ct.startsWith('#EXTM3U')} len=${ct.length}`);
                    }
                  }
                }catch(e){console.log(`ERR ${lang.code} ${e.stack||e.message}`)}
              }
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Commit report and self-remove
        shell: bash
        run: |
          rm -f .github/workflows/probe-anidb-playback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .anidb-playback-probe.txt .github/workflows/probe-anidb-playback.yml
          git commit -m "Probe AniDB playback path [skip ci]"
          git push origin HEAD:Limitless-Nuviotest
