name: AllAnime Crypto Inspect

on:
  push:
    branches: [Limitless-Nuviotest]
    paths: [.github/workflows/allanime-crypto-inspect.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect current MKissa crypto chunk
        shell: bash
        run: |
          node <<'NODE' > allanime-crypto-inspect.txt 2>&1
          const SITE='https://mkissa.to';
          const h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Referer':SITE+'/'};
          const resolve=(v,b)=>new URL(v,b).toString();
          (async()=>{
            const html=await (await fetch(SITE+'/',{headers:h})).text();
            let m=/import\("([^"]*\/entry\/app\.[^"]*\.js)"\)/.exec(html)||/src=["']([^"']*\/entry\/app\.[^"']*\.js)["']/.exec(html);
            if(!m) throw new Error('app entry not found');
            const appUrl=resolve(m[1],SITE+'/');
            console.log('APP',appUrl);
            const app=await (await fetch(appUrl,{headers:h})).text();
            const refs=[]; for(const x of app.matchAll(/["'](\.\.?\/[\w./-]+\.js)["']/g)) if(!refs.includes(x[1])) refs.push(x[1]);
            refs.sort((a,b)=>Number(b.includes('/chunks/'))-Number(a.includes('/chunks/')));
            console.log('REFS',refs.length);
            let found=0;
            for(const ref of refs.slice(0,60)){
              const u=resolve(ref,appUrl); let body='';
              try{const r=await fetch(u,{headers:h}); if(!r.ok) continue; body=await r.text();}catch{continue}
              if(!/(aaReq|x-aa-boot|client-crypto|partB)/.test(body)) continue;
              found++;
              console.log('\n=== CHUNK',u,'len',body.length,'===');
              const patterns=[
                /saltMul.{0,180}/g,
                /saltAdd.{0,180}/g,
                /fragMul.{0,180}/g,
                /fragAdd.{0,180}/g,
                /bootPrefix.{0,220}/g,
                /omitEmptyLane.{0,180}/g,
                /keyGroup.{0,180}/g,
                /join.{0,140}parts.{0,260}/g,
                /kNk1YgwkSI.{0,180}/g,
                /aa-boot:.{0,180}/g,
                /x-aa-boot.{0,260}/g,
                /client-crypto\/v1\/bootstrap.{0,260}/g,
                /aaReq.{0,300}/g
              ];
              for(const re of patterns){
                const vals=[...body.matchAll(re)].slice(0,6).map(x=>x[0]);
                for(const v of vals) console.log('MATCH',v.replace(/\s+/g,' ').slice(0,500));
              }
              const idxs=[];
              for(const key of ['saltMul','kNk1YgwkSI','x-aa-boot','aaReq','partB']){
                const i=body.indexOf(key); if(i>=0) idxs.push([key,i]);
              }
              for(const [key,i] of idxs){
                console.log('SNIP',key, body.slice(Math.max(0,i-600),Math.min(body.length,i+1200)).replace(/\s+/g,' ').slice(0,1900));
              }
              if(found>=3) break;
            }
            console.log('\nFOUND_CHUNKS',found);
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
          cat allanime-crypto-inspect.txt
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add allanime-crypto-inspect.txt
          git commit -m "Record temporary MKissa crypto inspection [skip ci]" || exit 0
          git push origin HEAD:Limitless-Nuviotest
