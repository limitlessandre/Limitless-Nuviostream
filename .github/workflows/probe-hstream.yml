name: Probe HStream

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-providers
    paths:
      - '.github/workflows/probe-hstream.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live HStream player chain
        shell: python
        run: |
          import json
          import re
          import urllib.parse
          import urllib.request
          import http.cookiejar

          page_url = 'https://hstream.moe/hentai/deco-x-deco-the-animation-1'
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          req = urllib.request.Request(page_url, headers={'User-Agent': ua, 'Accept': 'text/html,*/*'})
          with opener.open(req, timeout=30) as response:
              html = response.read().decode('utf-8', 'replace')
              print('page', response.status, response.geturl(), 'bytes', len(html))

          match = re.search(r'e_id["\']?\s+type=["\']hidden["\']\s+value=["\']([^"\']+)', html, re.I)
          if not match:
              match = re.search(r'name=["\']e_id["\'][^>]*value=["\']([^"\']+)', html, re.I)
          if not match:
              print('e_id markers:', [m.group(0)[:180] for m in re.finditer(r'e_id.{0,140}', html, re.I)][:5])
              raise SystemExit('e_id not found')
          episode_id = match.group(1)
          print('episode_id', episode_id)

          cookies = {c.name: c.value for c in jar}
          print('cookie_names', sorted(cookies))
          xsrf = urllib.parse.unquote(cookies.get('XSRF-TOKEN', ''))
          if not xsrf:
              raise SystemExit('XSRF-TOKEN cookie missing')

          body = json.dumps({'episode_id': episode_id}).encode()
          api_req = urllib.request.Request(
              'https://hstream.moe/player/api',
              data=body,
              method='POST',
              headers={
                  'User-Agent': ua,
                  'Accept': 'application/json',
                  'Content-Type': 'application/json',
                  'Referer': page_url,
                  'Origin': 'https://hstream.moe',
                  'X-Requested-With': 'XMLHttpRequest',
                  'X-XSRF-TOKEN': xsrf,
              },
          )
          with opener.open(api_req, timeout=30) as response:
              raw = response.read().decode('utf-8', 'replace')
              print('api', response.status, 'bytes', len(raw))
              data = json.loads(raw)

          print('api_keys', sorted(data.keys()))
          print('title', data.get('title'))
          print('stream_domains', data.get('stream_domains'))
          print('stream_url', data.get('stream_url'))
          print('extra_subtitles', data.get('extra_subtitles'))

          domains = data.get('stream_domains') or []
          stream_path = str(data.get('stream_url') or '').replace('\\\\', '/').replace('\\', '/')
          if not domains or not stream_path:
              raise SystemExit('stream domains/path missing')

          def joined(base, path):
              return urllib.parse.urljoin(base.rstrip('/') + '/', path.lstrip('/'))

          cdn = joined(domains[0], stream_path)
          print('cdn_base', cdn)
          candidates = [
              '360/manifest.mpd', '480/manifest.mpd', '720/manifest.mpd', '1080/manifest.mpd',
              '1440/manifest.mpd', '2160/manifest.mpd', '2160_48/manifest.mpd', '1080_48/manifest.mpd',
              '4k/manifest.mpd', '4k48/manifest.mpd'
          ]
          for suffix in candidates:
              url = urllib.parse.urljoin(cdn.rstrip('/') + '/', suffix)
              request = urllib.request.Request(url, headers={'User-Agent': ua, 'Referer': page_url})
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      sample = response.read(500).decode('utf-8', 'replace')
                      print('manifest', suffix, response.status, response.headers.get('content-type'), 'sample', sample[:120].replace('\n',' '))
              except Exception as exc:
                  print('manifest', suffix, 'ERR', str(exc)[:160])
