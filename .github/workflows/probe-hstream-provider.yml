name: Probe HStream Provider

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-providers
    paths:
      - '.github/workflows/probe-hstream-provider.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Call HStream provider through Scarlet Peach metadata
        run: |
          node - <<'NODE'
          const provider = require('./providers/scarlet-peach-hstream-v1.js');
          (async () => {
            const ids = ['sp:hanime:deco-x-deco-the-animation', 'sp:hanime:deco-x-deco-the-animation-1'];
            let rows = [];
            let used = '';
            for (const id of ids) {
              rows = await provider.getStreams(id, 'tv', 1, 1);
              console.log('ID', id, JSON.stringify(rows, null, 2));
              if (Array.isArray(rows) && rows.length && !/DIAG\s+(ID|MATCH|PLAYBACK|RESOLVER)/i.test(String(rows[0].name || ''))) {
                used = id;
                break;
              }
            }
            if (!used) throw new Error('No Scarlet Peach Deco x Deco ID reached playable HStream rows');
            const qualities = rows.map(r => String(r.quality || ''));
            if (!qualities.includes('2160p')) throw new Error(`Missing HStream 2160p through provider: ${qualities.join(',')}`);
            if (!rows.every(r => String(r.type || '').toLowerCase() === 'mpd')) throw new Error('HStream provider did not return MPD type');
            console.log('HStream provider smoke passed with', used, qualities.join('/'));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
