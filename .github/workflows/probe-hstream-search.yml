name: Probe HStream Search

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-providers
    paths:
      - '.github/workflows/probe-hstream-search.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect search form and routes
        shell: python
        run: |
          import re
          import urllib.parse
          import urllib.request

          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept': 'text/html,*/*'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read().decode('utf-8','replace')
                      print('GET', url, '->', r.status, r.geturl(), 'bytes', len(body), 'decoHits', len(re.findall('Deco x Deco', body, re.I)))
                      return body
              except Exception as e:
                  print('GET', url, 'ERR', repr(e))
                  return ''

          home = get('https://hstream.moe/')
          for m in re.finditer(r'<form[^>]*>[\s\S]{0,1200}?</form>', home, re.I):
              block = m.group(0)
              if re.search(r'search', block, re.I):
                  print('SEARCH_FORM', re.sub(r'\s+', ' ', block)[:1800])

          q = urllib.parse.quote('Deco x Deco')
          urls = [
              f'https://hstream.moe/search?search={q}',
              f'https://hstream.moe/search?q={q}',
              f'https://hstream.moe/search?query={q}',
              f'https://hstream.moe/search/{q}',
              f'https://hstream.moe/browse?search={q}',
              f'https://hstream.moe/browse?q={q}',
              f'https://hstream.moe/?search={q}',
              f'https://hstream.moe/?q={q}'
          ]
          for url in urls:
              body = get(url)
              if body and re.search(r'/hentai/deco-x-deco-the-animation-1', body, re.I):
                  print('MATCH_ROUTE', url)
