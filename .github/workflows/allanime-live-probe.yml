name: AllAnime Live Probe

on:
  push:
    branches:
      - Limitless-Nuviotest
    paths:
      - .github/workflows/allanime-live-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe AllAnime against Oshi no Ko S1E1
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const Module = require('module');
          const path = require('path');

          const nativeFetch = global.fetch;
          global.fetch = async function(url, options = {}) {
            const started = Date.now();
            try {
              const res = await nativeFetch(url, options);
              const u = String(url);
              if (/mkissa|allanime|anilist|haglund|themoviedb|hf\.space/.test(u) || !res.ok) {
                console.log(`[fetch] ${options.method || 'GET'} ${res.status} ${Date.now()-started}ms ${u.slice(0,240)}`);
              }
              return res;
            } catch (e) {
              console.log(`[fetch-error] ${String(url).slice(0,240)} :: ${e.message}`);
              throw e;
            }
          };

          let code = fs.readFileSync('providers/allanime.js', 'utf8');
          code += `\nmodule.exports.__probe = { tmdbInfo, malMap, anilistByMal, armAnilist, anilistById, searchAnime, exactCandidate, resolveBuild, maskCandidates, getMaterial, streamEpisode, uniq, clean };\n`;
          const mod = new Module(path.resolve('providers/allanime-probe-runtime.js'), module);
          mod.filename = path.resolve('providers/allanime-probe-runtime.js');
          mod.paths = module.paths;
          mod._compile(code, mod.filename);
          const p = mod.exports;
          const d = p.__probe;

          (async () => {
            console.log('=== AllAnime live probe: Oshi no Ko / TMDB 203737 / S1E1 ===');
            const tmdb = await d.tmdbInfo(203737, 'tv');
            console.log('TMDB', JSON.stringify(tmdb));
            if (!tmdb || !tmdb.imdb) throw new Error('TMDB/IMDb mapping failed');

            const map = await d.malMap(tmdb.imdb, 1, 1);
            console.log('MAL map', JSON.stringify(map));
            let media = map && map.mal_id ? await d.anilistByMal(map.mal_id) : null;
            if (!media) media = await d.anilistById(await d.armAnilist(203737));
            console.log('AniList', JSON.stringify(media));
            if (!media) throw new Error('AniList mapping failed');

            const targetEp = map && map.mal_episode != null ? Number(map.mal_episode) : 1;
            const aliases = d.uniq([
              media?.title?.english,
              media?.title?.romaji,
              map?.anime_title,
              tmdb.title,
              tmdb.original,
              media?.title?.native,
              ...(Array.isArray(media?.synonyms) ? media.synonyms : [])
            ]);
            console.log('Aliases', aliases.slice(0,8));

            let results = [];
            for (const alias of aliases.slice(0,5)) {
              const r = await d.searchAnime(alias, 'sub').catch(e => { console.log('search failed', alias, e.message); return []; });
              console.log(`Search SUB ${JSON.stringify(alias)} -> ${r.length}`);
              results.push(...r);
              if (r.some(x => String(x.aniListId) === String(media.id))) break;
            }
            const show = d.exactCandidate(results, media.id, aliases);
            console.log('Exact show', show ? JSON.stringify({_id:show._id,name:show.name,englishName:show.englishName,aniListId:show.aniListId,slugTime:show.slugTime}) : 'NONE');
            if (!show) throw new Error('MKissa title/ID match failed');

            const build = await d.resolveBuild();
            console.log('Build', JSON.stringify(build));
            const masks = d.maskCandidates(build.buildId, build.seeds);
            console.log('Mask candidates', masks.length);
            const material = await d.getMaterial(false);
            console.log('Material', JSON.stringify({buildId:material.buildId,epoch:material.epoch,keyBytes:material.key.length}));

            const ep = await d.streamEpisode(show._id, 'sub', targetEp, 0);
            console.log('Episode payload', ep ? JSON.stringify({sourceCount:Array.isArray(ep.sourceUrls)?ep.sourceUrls.length:null,sources:(ep.sourceUrls||[]).map(x=>({name:x.sourceName,type:x.type,url:String(x.sourceUrl||'').slice(0,100)}))}, null, 2) : 'NULL');
            if (!ep || !Array.isArray(ep.sourceUrls) || ep.sourceUrls.length === 0) throw new Error('No episode source URLs');

            const streams = await p.getStreams('203737', 'tv', 1, 1);
            console.log('Final streams', JSON.stringify(streams.map(x => ({name:x.name,title:x.title,quality:x.quality,url:String(x.url).slice(0,120)})), null, 2));
            if (!streams.length) throw new Error('Provider returned zero playable streams');
            console.log('PROBE_OK');
          })().catch(err => {
            console.error('PROBE_FAILED', err && err.stack ? err.stack : err);
            process.exitCode = 1;
          });
          NODE
