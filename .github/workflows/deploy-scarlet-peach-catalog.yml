name: Deploy Scarlet Peach Catalog

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-catalog
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'data/seed.json'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-scarlet-peach-catalog.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: npm test

      - name: Harvest Hanime provider catalog
        run: npm run import:hanime

      - name: Harvest HentaiHaven provider catalog
        run: npm run import:hentaihaven

      - name: Harvest HStream provider catalog
        run: npm run import:hstream

      - name: Build merged normalized snapshot
        run: npm run build:snapshot

      - name: Verify merged snapshot integrity
        run: npm run verify:snapshot

      - name: Deploy Worker
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify catalog health, home rows, collections, and subtitle resource
        run: |
          set -euo pipefail
          BASE='https://scarlet-peach-catalog.limitlessandre.workers.dev'
          for attempt in $(seq 1 12); do
            BODY="$(curl --silent --show-error "$BASE/health" || true)"
            echo "health attempt ${attempt}: ${BODY}"
            if echo "$BODY" | grep -q '"ok":true' && \
               echo "$BODY" | grep -q '"version":"0.7.0"' && \
               echo "$BODY" | grep -q '"schemaVersion":2' && \
               echo "$BODY" | grep -q '"subtitleResource":true' && \
               echo "$BODY" | grep -q '"taxonomyGroups":4' && \
               echo "$BODY" | grep -q '"collectionsResource":true' && \
               echo "$BODY" | grep -q '"scarlet-peach-popular"' && \
               echo "$BODY" | grep -q '"hanime"' && \
               echo "$BODY" | grep -q '"hentaihaven"' && \
               echo "$BODY" | grep -q '"hstream"'; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "Scarlet Peach merged catalog health verification failed after propagation window" >&2
              exit 1
            fi
            sleep 3
          done

          curl --fail --retry 4 --retry-all-errors --silent --show-error "$BASE/manifest.json" > /tmp/manifest.json
          curl --fail --retry 4 --retry-all-errors --silent --show-error "$BASE/taxonomy.json" > /tmp/taxonomy.json
          curl --fail --retry 4 --retry-all-errors --silent --show-error "$BASE/collections.json" > /tmp/collections.json
          curl --fail --retry 4 --retry-all-errors --silent --show-error "$BASE/catalog/series/scarlet-peach-latest.json" > /tmp/latest.json
          curl --fail --retry 4 --retry-all-errors --silent --show-error "$BASE/catalog/series/scarlet-peach-popular.json" > /tmp/popular.json

          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('/tmp/manifest.json', 'utf8'));
          const taxonomy = JSON.parse(fs.readFileSync('/tmp/taxonomy.json', 'utf8'));
          const collections = JSON.parse(fs.readFileSync('/tmp/collections.json', 'utf8'));
          const latest = JSON.parse(fs.readFileSync('/tmp/latest.json', 'utf8'));
          const popular = JSON.parse(fs.readFileSync('/tmp/popular.json', 'utf8'));

          if (manifest.version !== '0.7.0') throw new Error(`wrong manifest version: ${manifest.version}`);
          if (!manifest.resources.includes('subtitles')) throw new Error('subtitles resource missing');

          const catalogs = new Map((manifest.catalogs || []).map((catalog) => [catalog.id, catalog]));
          for (const id of ['scarlet-peach-latest', 'scarlet-peach-popular']) {
            const catalog = catalogs.get(id);
            if (!catalog) throw new Error(`visible discovery catalog missing: ${id}`);
            if ((catalog.extra || []).some((extra) => extra.isRequired)) throw new Error(`${id} should remain a visible addon home row`);
          }
          for (const id of ['scarlet-peach-main', 'scarlet-peach-kinks', 'scarlet-peach-characters', 'scarlet-peach-niche', 'scarlet-peach-all']) {
            const catalog = catalogs.get(id);
            if (!catalog) throw new Error(`collection source catalog missing: ${id}`);
            if (!(catalog.extra || []).some((extra) => extra.isRequired)) throw new Error(`${id} should be hidden from automatic addon home rows`);
          }

          if (!Array.isArray(taxonomy.groups) || taxonomy.groups.length !== 4) throw new Error('expected four taxonomy groups');
          const taxonomyText = JSON.stringify(taxonomy);
          for (const label of ['MILF', 'Rape', 'Womb Tattoo', 'Step Mother']) {
            if (!taxonomyText.includes(label)) throw new Error(`taxonomy label missing: ${label}`);
          }

          if (!Array.isArray(collections) || collections.length !== 4) throw new Error('expected exactly four Scarlet Peach collection rows');
          const expectedTitles = ['Scarlet Peach Main', 'Scarlet Peach Kinks', 'Scarlet Peach Characters', 'Scarlet Peach Niche'];
          if (JSON.stringify(collections.map((collection) => collection.title)) !== JSON.stringify(expectedTitles)) {
            throw new Error(`unexpected collection rows: ${collections.map((collection) => collection.title).join(', ')}`);
          }
          for (const collection of collections) {
            if (collection.pinToTop !== false) throw new Error(`${collection.title} should sit below Latest/Popular by default`);
            if (collection.viewMode !== 'ROWS') throw new Error(`${collection.title} must use ROWS viewMode`);
            if (collection.showAllTab !== true) throw new Error(`${collection.title} must expose All tab`);
            for (const folder of collection.folders || []) {
              if (folder.tileShape !== 'LANDSCAPE') throw new Error(`${collection.title}/${folder.title} is not LANDSCAPE`);
            }
          }
          const collectionText = JSON.stringify(collections);
          for (const label of ['Big Boobs', 'Maid']) {
            if (!collectionText.includes(`\"genre\":\"${label}\"`)) throw new Error(`collection genre missing: ${label}`);
          }

          if (!Array.isArray(latest.metas) || latest.metas.length === 0) throw new Error('Latest returned no titles');
          if (!Array.isArray(popular.metas) || popular.metas.length === 0) throw new Error('Popular returned no titles');
          console.log(JSON.stringify({
            version: manifest.version,
            visibleAddonRows: ['Scarlet Peach Latest', 'Scarlet Peach Popular'],
            collectionRows: collections.map((collection) => ({ title: collection.title, folders: collection.folders.length })),
            latestCount: latest.metas.length,
            popularCount: popular.metas.length
          }, null, 2));
          NODE

      - name: Report taxonomy and artwork coverage
        continue-on-error: true
        run: |
          node - <<'NODE'
          const base = 'https://scarlet-peach-catalog.limitlessandre.workers.dev';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function fetchJson(url) {
            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const response = await fetch(url);
                if (response.ok) return await response.json();
                console.warn(`attempt ${attempt}: ${response.status} ${url}`);
              } catch (error) {
                console.warn(`attempt ${attempt}: ${error.message} ${url}`);
              }
              await sleep(attempt * 750);
            }
            return null;
          }

          const taxonomy = await fetchJson(`${base}/taxonomy.json`);
          if (!taxonomy) throw new Error('Could not load live taxonomy for coverage report');
          for (const group of taxonomy.groups || []) {
            console.log(`\n[${group.name}]`);
            for (const category of group.categories || []) {
              const url = `${base}/catalog/series/${group.id}/genre=${encodeURIComponent(category)}.json`;
              const payload = await fetchJson(url);
              if (!payload) {
                console.warn(JSON.stringify({ category, warning: 'coverage request failed after retries' }));
                continue;
              }
              const metas = Array.isArray(payload.metas) ? payload.metas : [];
              const posters = metas.filter((meta) => meta.poster).length;
              const backgrounds = metas.filter((meta) => meta.background).length;
              console.log(JSON.stringify({ category, titles: metas.length, posters, backgrounds }));
            }
          }
          NODE

      - name: Verify Nuvio Desktop subtitle endpoint
        run: |
          set -euo pipefail

          curl --fail --retry 4 --retry-all-errors --silent --show-error --max-time 30 \
            'https://scarlet-peach-catalog.limitlessandre.workers.dev/catalog/series/scarlet-peach-search/search=Deco%20x%20Deco.json' \
            > /tmp/deco-search.json
          cat /tmp/deco-search.json

          VIDEO_ID_ENCODED="$(node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('/tmp/deco-search.json','utf8'));
          const metas=Array.isArray(d.metas)?d.metas:[];
          const meta=metas.find(m=>/deco\s*x\s*deco/i.test(String(m.name||''))) || metas[0];
          if (!meta || !meta.id) throw new Error('Deco not found in live Scarlet Peach catalog');
          const hstream=(meta.providerMappings||[]).find(m=>m.provider==='hstream');
          if (!hstream) throw new Error('Live Deco metadata is missing HStream mapping');
          const videoId=`${meta.id}:1`;
          console.error(`Testing live video ID: ${videoId}`);
          process.stdout.write(encodeURIComponent(videoId));
          NODE
          )"

          URL="https://scarlet-peach-catalog.limitlessandre.workers.dev/subtitles/series/${VIDEO_ID_ENCODED}.json"
          curl --fail --retry 4 --retry-all-errors --silent --show-error --max-time 90 "$URL" > /tmp/subtitles.json
          cat /tmp/subtitles.json
          SUB_URL="$(node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('/tmp/subtitles.json','utf8'));
          if (!Array.isArray(d.subtitles) || !d.subtitles.length) throw new Error('No Scarlet Peach subtitles returned');
          const en=d.subtitles.find(s=>String(s.lang||s.language||'').toLowerCase()==='en');
          if (!en || !en.url) throw new Error('English HentaiHaven subtitle missing');
          if (!/scarlet-peach-catalog\.limitlessandre\.workers\.dev\/subtitle-proxy\.vtt/i.test(en.url)) throw new Error(`English subtitle is not proxied: ${en.url}`);
          process.stdout.write(en.url);
          NODE
          )"
          echo "English subtitle: $SUB_URL"
          curl --fail --retry 4 --retry-all-errors --silent --show-error --max-time 30 "$SUB_URL" > /tmp/subtitle.vtt
          head -40 /tmp/subtitle.vtt
          grep -q 'WEBVTT' /tmp/subtitle.vtt
