name: Deploy Scarlet Peach Catalog

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-catalog
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'data/seed.json'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-scarlet-peach-catalog.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: npm test

      - name: Harvest Hanime provider catalog
        run: npm run import:hanime

      - name: Harvest HentaiHaven provider catalog
        run: npm run import:hentaihaven

      - name: Harvest HStream provider catalog
        run: npm run import:hstream

      - name: Build merged normalized snapshot
        run: npm run build:snapshot

      - name: Verify merged snapshot integrity
        run: npm run verify:snapshot

      - name: Deploy Worker
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify catalog health, taxonomy, and subtitle resource
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            BODY="$(curl --silent --show-error https://scarlet-peach-catalog.limitlessandre.workers.dev/health || true)"
            echo "health attempt ${attempt}: ${BODY}"
            if echo "$BODY" | grep -q '"ok":true' && \
               echo "$BODY" | grep -q '"version":"0.6.0"' && \
               echo "$BODY" | grep -q '"schemaVersion":2' && \
               echo "$BODY" | grep -q '"subtitleResource":true' && \
               echo "$BODY" | grep -q '"taxonomyGroups":4' && \
               echo "$BODY" | grep -q '"hanime"' && \
               echo "$BODY" | grep -q '"hentaihaven"' && \
               echo "$BODY" | grep -q '"hstream"'; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "Scarlet Peach merged catalog health verification failed after propagation window" >&2
              exit 1
            fi
            sleep 3
          done

          MANIFEST="$(curl --fail --silent --show-error https://scarlet-peach-catalog.limitlessandre.workers.dev/manifest.json)"
          echo "$MANIFEST"
          echo "$MANIFEST" | grep -q '"subtitles"'
          echo "$MANIFEST" | grep -q '"scarlet-peach-main"'
          echo "$MANIFEST" | grep -q '"scarlet-peach-kinks"'
          echo "$MANIFEST" | grep -q '"scarlet-peach-characters"'
          echo "$MANIFEST" | grep -q '"scarlet-peach-niche"'

          TAXONOMY="$(curl --fail --silent --show-error https://scarlet-peach-catalog.limitlessandre.workers.dev/taxonomy.json)"
          echo "$TAXONOMY"
          echo "$TAXONOMY" | grep -q '"MILF"'
          echo "$TAXONOMY" | grep -q '"Rape"'
          echo "$TAXONOMY" | grep -q '"Womb Tattoo"'

      - name: Report taxonomy and artwork coverage
        run: |
          node - <<'NODE'
          const base = 'https://scarlet-peach-catalog.limitlessandre.workers.dev';
          const taxonomy = await (await fetch(`${base}/taxonomy.json`)).json();
          for (const group of taxonomy.groups || []) {
            console.log(`\n[${group.name}]`);
            for (const category of group.categories || []) {
              const url = `${base}/catalog/series/${group.id}/genre=${encodeURIComponent(category)}.json`;
              const response = await fetch(url);
              if (!response.ok) throw new Error(`${category}: HTTP ${response.status}`);
              const payload = await response.json();
              const metas = Array.isArray(payload.metas) ? payload.metas : [];
              const posters = metas.filter((meta) => meta.poster).length;
              const backgrounds = metas.filter((meta) => meta.background).length;
              console.log(JSON.stringify({ category, titles: metas.length, posters, backgrounds }));
            }
          }
          NODE

      - name: Verify Nuvio Desktop subtitle endpoint
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --max-time 30 \
            'https://scarlet-peach-catalog.limitlessandre.workers.dev/catalog/series/scarlet-peach-search/search=Deco%20x%20Deco.json' \
            > /tmp/deco-search.json
          cat /tmp/deco-search.json

          VIDEO_ID_ENCODED="$(node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('/tmp/deco-search.json','utf8'));
          const metas=Array.isArray(d.metas)?d.metas:[];
          const meta=metas.find(m=>/deco\s*x\s*deco/i.test(String(m.name||''))) || metas[0];
          if (!meta || !meta.id) throw new Error('Deco not found in live Scarlet Peach catalog');
          const hstream=(meta.providerMappings||[]).find(m=>m.provider==='hstream');
          if (!hstream) throw new Error('Live Deco metadata is missing HStream mapping');
          const videoId=`${meta.id}:1`;
          console.error(`Testing live video ID: ${videoId}`);
          process.stdout.write(encodeURIComponent(videoId));
          NODE
          )"

          URL="https://scarlet-peach-catalog.limitlessandre.workers.dev/subtitles/series/${VIDEO_ID_ENCODED}.json"
          curl --fail --silent --show-error --max-time 90 "$URL" > /tmp/subtitles.json
          cat /tmp/subtitles.json
          SUB_URL="$(node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('/tmp/subtitles.json','utf8'));
          if (!Array.isArray(d.subtitles) || !d.subtitles.length) throw new Error('No Scarlet Peach subtitles returned');
          const en=d.subtitles.find(s=>String(s.lang||s.language||'').toLowerCase()==='en');
          if (!en || !en.url) throw new Error('English HentaiHaven subtitle missing');
          if (!/scarlet-peach-catalog\.limitlessandre\.workers\.dev\/subtitle-proxy\.vtt/i.test(en.url)) throw new Error(`English subtitle is not proxied: ${en.url}`);
          process.stdout.write(en.url);
          NODE
          )"
          echo "English subtitle: $SUB_URL"
          curl --fail --silent --show-error --max-time 30 "$SUB_URL" > /tmp/subtitle.vtt
          head -40 /tmp/subtitle.vtt
          grep -q 'WEBVTT' /tmp/subtitle.vtt
