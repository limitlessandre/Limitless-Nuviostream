name: 123Anime Playback Probe

on:
  push:
    branches:
      - Limitless-Nuviotest
    paths:
      - .github/workflows/123anime-playback-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch 123Anime for Nuvio desktop HLS detection
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          path = Path('providers/123anime.js')
          s = path.read_text()

          if 'async function normalizeHls(' not in s:
              anchor = s.index('function makeStream(')
              block = r'''async function normalizeHls(url, headers) {
            const fallback = { url, quality: quality(url) };
            if (!url || !/m3u8/i.test(String(url))) return fallback;

            const body = await text(url, { headers }, 10000);
            if (!body || !body.trimStart().startsWith("#EXTM3U")) return fallback;

            const lines = body.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
            const variants = [];
            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              if (!line.startsWith("#EXT-X-STREAM-INF:")) continue;
              const res = line.match(/RESOLUTION=(\d+)x(\d+)/i);
              const bw = line.match(/BANDWIDTH=(\d+)/i);
              let uri = null;
              for (let j = i + 1; j < lines.length; j++) {
                if (lines[j].startsWith("#")) continue;
                uri = lines[j];
                break;
              }
              if (!uri) continue;
              variants.push({
                uri,
                height: res ? parseInt(res[2], 10) : 0,
                bandwidth: bw ? parseInt(bw[1], 10) : 0
              });
            }

            if (!variants.length) return fallback;
            variants.sort((a, b) => (b.height - a.height) || (b.bandwidth - a.bandwidth));
            const best = variants[0];
            let child = abs(best.uri, url);
            if (!child) return fallback;
            if (!/\.m3u8(?:$|[?#])/i.test(child)) {
              child += (child.includes("?") ? "&" : "?") + "nuvio.m3u8";
            }
            return { url: child, quality: best.height ? `${best.height}p` : fallback.quality };
          }

          '''
              s = s[:anchor] + block + s[anchor:]

          old_sig = 'function makeStream(url, mode, server, variant, tracks, headers, ctx) {'
          if old_sig in s:
              s = s.replace(old_sig, 'function makeStream(url, mode, server, variant, tracks, headers, ctx, qualityOverride) {', 1)
          s = s.replace('  const q = quality(url);', '  const q = qualityOverride || quality(url);', 1)

          marker = '  const variants = ["JW", "SBv2"];'
          marker_pos = s.index(marker)
          loop_start = s.index('  for (let i = 0; i < results.length; i++) {', marker_pos)
          loop_end = s.index('  return out;', loop_start)
          new_loop = '''  for (let i = 0; i < results.length; i++) {
            const u = results[i];
            if (!u) continue;
            const normalized = await normalizeHls(u, headers);
            const finalUrl = normalized.url;
            if (!finalUrl || seen.has(finalUrl)) continue;
            seen.add(finalUrl);
            const stream = makeStream(finalUrl, mode, server.label, variants[i], tracks, headers, ctx, normalized.quality);
            if (stream) out.push(stream);
          }
          '''
          s = s[:loop_start] + new_loop + s[loop_end:]
          s = s.replace('      const key = `${stream.url}|${stream.language}|${stream.name}`;', '      const key = `${stream.url}|${stream.language}`;', 1)
          path.write_text(s)

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['version'] = '0.1.12'
          for provider in manifest['scrapers']:
              if provider.get('id') == 'limitless-123anime':
                  provider['version'] = '1.0.1'
                  provider['description'] = 'Limitless Nuvio port of AniYomi 123Anime with mirror failover, season-aware MAL mapping, exact finite aliases, SUB/DUB extraction, and a Nuvio-specific HLS child-playlist MIME workaround.'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          lock_path = Path('sources-lock.json')
          lock = json.loads(lock_path.read_text())
          lock['baseline'] = 'anime-v0.1.12'
          for provider in lock['providers']:
              if provider.get('filename') == '123anime.js':
                  provider['localVersion'] = '1.0.1'
                  provider['notes'] = 'AniYomi-to-Nuvio port. Nuvio-specific workaround resolves the CDN master playlist to the best child and appends an HLS query hint because the CDN labels extensionless playlists as image/jpeg. Duplicate server aliases resolving to the same stream are collapsed.'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')
          PY
          node --check providers/123anime.js
      - run: npm install cheerio@1.0.0-rc.12
      - name: Validate patched streams
        shell: bash
        run: |
          node <<'NODE' > 123anime-playback-probe.txt 2>&1
          const fs=require('fs'),Module=require('module'),path=require('path');
          let code=fs.readFileSync('providers/123anime.js','utf8').replace('cheerio-without-node-native','cheerio');
          const mod=new Module(path.resolve('providers/123anime-probe-runtime.js'),module); mod.filename=path.resolve('providers/123anime-probe-runtime.js'); mod.paths=module.paths; mod._compile(code,mod.filename);
          const p=mod.exports, KEY='1865f43a0549ca50d341dd9ab8b29f49';
          (async()=>{
            const q=await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${KEY}&query=${encodeURIComponent('Saga of Tanya the Evil')}`); const j=await q.json(); const hit=(j.results||[])[0];
            console.log('TMDB',hit&&{id:hit.id,name:hit.name});
            const streams=await p.getStreams(String(hit.id),'tv',1,1); console.log('STREAM_COUNT',streams.length);
            for(const s of streams){
              console.log('\nSTREAM',JSON.stringify({name:s.name,url:s.url,quality:s.quality,headers:s.headers},null,2));
              const r=await fetch(s.url,{headers:s.headers||{},redirect:'follow'}); const body=await r.text();
              console.log('PLAYLIST',r.status,r.headers.get('content-type'),JSON.stringify(body.slice(0,500)));
              if(!body.trimStart().startsWith('#EXTM3U')) throw new Error('not HLS');
              const lines=body.split(/\r?\n/).map(x=>x.trim()).filter(Boolean); const seg=lines.find(x=>!x.startsWith('#'));
              console.log('FIRST_URI',seg||'NONE');
              if(seg){ const u=new URL(seg,r.url).toString(); const rr=await fetch(u,{headers:s.headers||{},redirect:'follow'}); const ab=await rr.arrayBuffer(); console.log('FIRST_FETCH',rr.status,rr.headers.get('content-type'),ab.byteLength,Buffer.from(ab).subarray(0,16).toString('hex')); }
            }
          })().catch(e=>{console.error('PROBE_FAILED',e&&e.stack||e);process.exitCode=1});
          NODE
      - name: Commit fix and result
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add providers/123anime.js manifest.json sources-lock.json 123anime-playback-probe.txt
          git commit -m 'Fix 123Anime HLS playback on Nuvio Desktop [skip ci]' || true
          git push
