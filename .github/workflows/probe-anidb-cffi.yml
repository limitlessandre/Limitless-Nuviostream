name: Probe AniDB browser TLS

on:
  push:
    branches: [Limitless-Nuviotest]
    paths:
      - .github/workflows/probe-anidb-cffi.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe curl-cffi impersonation
        shell: bash
        run: |
          pip install -q curl_cffi
          python3 - <<'PY' > .anidb-cffi-probe.txt 2>&1
          from curl_cffi import requests
          from urllib.parse import quote
          for q in ['Saga of Tanya the Evil', 'Frieren']:
              url = 'https://anidb.app/browse?q=' + quote(q)
              for imp in ['chrome', 'chrome124', 'chrome120']:
                  try:
                      r = requests.get(url, impersonate=imp, timeout=20)
                      text = r.text
                      print(q, imp, r.status_code, len(text), 'challenge=', 'Just a moment' in text, 'anime=', '/anime/' in text)
                      print(text[:800].replace('\n',' '))
                      if r.status_code == 200 and '/anime/' in text and 'Just a moment' not in text:
                          break
                  except Exception as e:
                      print(q, imp, 'ERR', repr(e))
          PY
      - name: Commit report and self-remove
        shell: bash
        run: |
          rm -f .github/workflows/probe-anidb-cffi.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .anidb-cffi-probe.txt .github/workflows/probe-anidb-cffi.yml
          git commit -m "Probe AniDB browser TLS client [skip ci]"
          git push origin HEAD:Limitless-Nuviotest
