name: Probe Scarlet Peach Native Tracks

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-providers
    paths:
      - '.github/workflows/probe-scarlet-peach-tracks.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe HentaiHaven Octopus master candidates
        run: |
          set -euo pipefail
          curl -sS --max-time 90 -X POST \
            https://scarlet-peach-hentaihaven.limitlessandre.workers.dev/resolve \
            -H 'content-type: application/json' \
            --data '{"title":"Deco x Deco The Animation","episode":1}' > /tmp/hh.json
          python - <<'PY' > /tmp/candidates.txt
          import json, urllib.parse
          d=json.load(open('/tmp/hh.json'))
          streams=d.get('streams',[])
          for s in streams:
              u=urllib.parse.urlparse(s.get('url',''))
              parts=[p for p in u.path.split('/') if p]
              if len(parts) < 2: continue
              root=f'{u.scheme}://{u.netloc}/{parts[0]}/'
              for name in ['playlist_vp9.m3u8','playlist.m3u8','master.m3u8','index.m3u8','v.m3u8']:
                  print(root+name)
          PY
          sort -u /tmp/candidates.txt | while read URL; do
            echo "===== $URL ====="
            code=$(curl -L -sS --max-time 20 -o /tmp/master.txt -w '%{http_code}' "$URL" || true)
            echo "HTTP $code"
            if [ "$code" = "200" ]; then
              head -80 /tmp/master.txt
              echo 'TRACK LINES:'
              grep -E '#EXT-X-MEDIA|#EXT-X-STREAM-INF' /tmp/master.txt || true
            fi
          done
