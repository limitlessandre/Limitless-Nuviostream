name: Deploy Scarlet Peach Identity Worker

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-providers
    paths:
      - 'workers/scarlet-peach-identity/**'
      - '.github/workflows/deploy-scarlet-peach-identity.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/scarlet-peach-identity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Worker syntax
        run: node --check src/index.js

      - name: Deploy Worker
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Worker health
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            body="$(curl --fail --silent --show-error --max-time 15 https://scarlet-peach-identity.limitlessandre.workers.dev/health || true)"
            if printf '%s' "$body" | grep -q 'Scarlet Peach Identity Resolver' && printf '%s' "$body" | grep -q '"version":"0.1.0"'; then
              printf '%s\n' "$body"
              break
            fi
            echo "Waiting for identity worker propagation (attempt ${attempt})"
            if [ "$attempt" = 8 ]; then
              echo 'Identity worker health check failed' >&2
              printf '%s\n' "$body" >&2
              exit 1
            fi
            sleep 3
          done

      - name: Probe TMDB and IMDb identity resolution
        run: |
          set -euo pipefail
          probe() {
            name="$1"
            payload="$2"
            body_file="/tmp/${name}.json"
            status="$(curl --silent --show-error --max-time 45 \
              -o "$body_file" -w '%{http_code}' \
              -X POST https://scarlet-peach-identity.limitlessandre.workers.dev/resolve \
              -H 'content-type: application/json' \
              --data "$payload" || true)"
            echo "${name} status=${status}"
            cat "$body_file" 2>/dev/null || true
            echo
            test "$status" = "200"
            NAME="$name" BODY_FILE="$body_file" node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.env.BODY_FILE, 'utf8'));
          if (!data.title || !/kite/i.test(data.title)) throw new Error(`${process.env.NAME} did not resolve Kite`);
          if (data.imdbId !== 'tt0246734') throw new Error(`${process.env.NAME} expected tt0246734, got ${data.imdbId}`);
          console.log(`${process.env.NAME} title=${data.title} imdb=${data.imdbId} tmdb=${data.tmdbId}`);
          NODE
          }

          probe tmdb-kite '{"id":"80219","type":"tv"}'
          probe imdb-kite '{"id":"tt0246734","type":"tv"}'
