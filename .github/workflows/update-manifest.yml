name: Update Limitless provider manifests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "overrides.json"
      - "cloudstream-config.json"
      - "custom/**"
      - "scripts/build_manifest.py"
      - "scripts/build_cloudstream.py"
      - "scripts/audit_port_candidates.py"
      - ".github/workflows/update-manifest.yml"

concurrency:
  group: limitless-provider-manifest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Limitless native provider JavaScript
        shell: bash
        run: |
          set -e
          for file in custom/providers/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Build native Nuvio manifest
        run: python scripts/build_manifest.py

      - name: Preserve canonical production manifest metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          generated_path = Path("manifest.json")
          canonical_path = Path("custom/manifest.json")
          generated = json.loads(generated_path.read_text(encoding="utf-8"))
          canonical = json.loads(canonical_path.read_text(encoding="utf-8"))
          for key in ("name", "version", "description"):
              if canonical.get(key):
                  generated[key] = canonical[key]
          generated_path.write_text(json.dumps(generated, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Build CloudStream compatibility repository
        id: cloudstream
        continue-on-error: true
        run: python scripts/build_cloudstream.py

      - name: Audit CloudStream providers not represented natively
        id: portaudit
        if: steps.cloudstream.outcome == 'success'
        continue-on-error: true
        run: python scripts/audit_port_candidates.py

      - name: Commit generated files when changed
        shell: bash
        run: |
          git add manifest.json duplicates.json build-status.json language-filter-report.json

          if [ "${{ steps.cloudstream.outcome }}" = "success" ]; then
            git add cloudstream-repo.json cloudstream-plugins.json cloudstream-duplicates.json \
              cloudstream-build-status.json cloudstream-language-filter-report.json \
              cloudstream-source-cache.json
          else
            echo "CloudStream build failed; keeping the last known CloudStream files unchanged."
          fi

          if [ "${{ steps.portaudit.outcome }}" = "success" ]; then
            git add cloudstream-port-candidates.json cloudstream-port-candidates.md
          else
            echo "Port candidate audit failed or was skipped; keeping the last audit unchanged."
          fi

          if git diff --cached --quiet; then
            echo "No provider changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Limitless provider manifests"
          git push
