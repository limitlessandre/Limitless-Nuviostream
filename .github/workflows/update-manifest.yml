name: Revert All-Wish fuzzy fallback

on:
  push:
    branches: [Limitless-Nuviotest]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert-allwish-fuzzy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore bounded All-Wish matcher
        shell: bash
        run: |
          set -euo pipefail

          # Restore the proven v1.2.1 provider implementation from immediately
          # before the experimental broad/fuzzy search was added. This keeps:
          # - season-aware MAL episode mapping
          # - MAL/Jikan + AniList + Kitsu + TMDB exact/normal aliases
          # - DUB/SUB separation
          # - one preferred subtitle track per language
          # and removes only the broad single-word fallback search.
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/limitlessandre/Limitless-Nuviostream/3f9865d4d497eeeb275cf4324ee1e160ac5f95c1/providers/allwish.js" \
            -o providers/allwish.js

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          manifest['version'] = '0.1.5'

          for item in manifest.get('scrapers', []):
              if item.get('id') == 'allwish':
                  item['name'] = 'All-Wish'
                  item['version'] = '1.2.3'
                  item['description'] = (
                      'Limitless-maintained All-Wish anime provider with season-aware MAL episode mapping, '
                      'MAL/AniList/Kitsu/TMDB title aliases, DUB/SUB separation, and one preferred '
                      'soft-subtitle track per language.'
                  )
                  break
          else:
              raise SystemExit('All-Wish manifest entry not found')

          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          rm -f .allwish-fuzzy-v122

          # Restore the clean validation-only workflow from before the fuzzy experiment.
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/limitlessandre/Limitless-Nuviostream/3f9865d4d497eeeb275cf4324ee1e160ac5f95c1/.github/workflows/update-manifest.yml" \
            -o .github/workflows/update-manifest.yml

          node --check providers/allwish.js
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          a = next(x for x in m['scrapers'] if x['id'] == 'allwish')
          assert m['version'] == '0.1.5'
          assert a['name'] == 'All-Wish'
          assert a['version'] == '1.2.3'
          assert 'fuzzy' not in a['description'].lower()
          code = Path('providers/allwish.js').read_text(encoding='utf-8')
          assert 'fallbackSearchTerms' not in code
          assert 'Fuzzy fallback' not in code
          print('All-Wish fuzzy fallback removed; retained bounded alias matching and subtitle fixes')
          PY

          git config user.name "Limitless Baseline Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Revert All-Wish fuzzy search and normalize provider name"
            git push
          fi
