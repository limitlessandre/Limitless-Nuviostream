name: Validate frozen Limitless anime baseline

on:
  push:
    branches: [Limitless-Nuviotest]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest and provenance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          lock = json.loads(Path('sources-lock.json').read_text(encoding='utf-8'))
          scrapers = manifest.get('scrapers', [])

          if len(scrapers) != 17:
              raise SystemExit(f'Expected 17 providers, found {len(scrapers)}')

          ids = [item['id'].casefold() for item in scrapers]
          names = [item['name'].casefold() for item in scrapers]
          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate provider id found')
          if len(names) != len(set(names)):
              raise SystemExit('Duplicate provider name found')

          manifest_files = set()
          for item in scrapers:
              filename = item['filename']
              if not filename.startswith('providers/'):
                  raise SystemExit(f'Non-local provider path: {filename}')
              if not Path(filename).is_file():
                  raise SystemExit(f'Missing provider file: {filename}')
              manifest_files.add(Path(filename).name)

          lock_files = {item['filename'] for item in lock.get('providers', [])}
          if manifest_files != lock_files:
              raise SystemExit('Manifest and sources-lock provider lists differ')

          if lock.get('baseline') != f"anime-v{manifest.get('version')}":
              raise SystemExit('Manifest version and sources-lock baseline differ')

          print(f'Validated {len(scrapers)} providers')
          PY

      - name: Syntax check providers
        run: |
          for file in providers/*.js; do
            echo "Syntax checking $file"
            node --check "$file"
          done
