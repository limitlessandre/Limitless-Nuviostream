name: Apply AllAnime MKissa protocol correction

on:
  push:
    branches: [Limitless-Nuviotest]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest

      - name: Patch AllAnime episode protocol
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('providers/allanime.js')
          text = p.read_text(encoding='utf-8')

          old_query = 'const EPISODE_QUERY = "query($showId:String! $translationType:VaildTranslationTypeEnumType! $episodeString:String!){episode(showId:$showId translationType:$translationType episodeString:$episodeString){episodeString sourceUrls}}";'
          new_query = 'const EPISODE_QUERY = "query($showId:String! $translationType:VaildTranslationTypeEnumType! $episodeString:String!){episode(showId:$showId translationType:$translationType episodeString:$episodeString){sourceUrls show{_id}}}";'
          if old_query not in text:
              raise SystemExit('Expected old EPISODE_QUERY not found')
          text = text.replace(old_query, new_query, 1)

          old_hashes = 'const hashes = EPISODE_QUERY_HASH === dynamicHash ? [EPISODE_QUERY_HASH] : [EPISODE_QUERY_HASH, dynamicHash];'
          new_hashes = 'const hashes = [dynamicHash];'
          if old_hashes not in text:
              raise SystemExit('Expected persisted hash selection not found')
          text = text.replace(old_hashes, new_hashes, 1)

          old_url = 'const url = API_URL + "?variables=" + encodeURIComponent(JSON.stringify(variables)) + "&extensions=" + encodeURIComponent(JSON.stringify(extensions));'
          new_url = 'const url = API_URL + "?query=" + encodeURIComponent(query) + "&variables=" + encodeURIComponent(JSON.stringify(variables)) + "&extensions=" + encodeURIComponent(JSON.stringify(extensions));'
          if old_url not in text:
              raise SystemExit('Expected episode GET URL builder not found')
          text = text.replace(old_url, new_url, 1)

          p.write_text(text, encoding='utf-8')

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.1.9'
          for item in manifest['scrapers']:
              if item.get('id') == 'allanime':
                  item['filename'] = 'providers/allanime.js'
                  item['version'] = '2.0.3'
                  item['description'] = ('Limitless-maintained AllAnime provider using the current MKissa rotating-key protocol, '
                                         'Aniyomi-aligned authenticated episode query registration, season-aware MAL mapping, '
                                         'finite verified title aliases, and explicit SUB/DUB streams.')
                  break
          else:
              raise SystemExit('AllAnime manifest entry not found')
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          lock_path = Path('sources-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['baseline'] = 'anime-v0.1.9'
          for item in lock['providers']:
              if item.get('filename') == 'allanime.js':
                  item['localVersion'] = '2.0.3'
                  item['notes'] = ('Limitless MKissa rewrite. Episode streaming now follows the current Aniyomi protocol: '
                                   'the full GraphQL stream query is sent beside the SHA-256 persisted-query hash and '
                                   'the episode selection includes show {_id}, which MKissa requires while resolving sourceUrls.')
                  break
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f providers/allanime-debug.js
          node --check providers/allanime.js

          # This is a one-shot carrier. Remove it from the resulting branch.
          rm -f .github/workflows/patch-allanime-protocol.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align AllAnime episode request with current MKissa protocol"
          git push origin HEAD:Limitless-Nuviotest
