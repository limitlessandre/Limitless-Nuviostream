name: Patch AniDB relation season discovery 1.0.5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-anidb-105.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Patch AniDB relation fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('providers/anidb.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('// Limitless AniDB 1.0.4', '// Limitless AniDB 1.0.5', 1)

          anchor = '''async function resolveAnimeIdentity(tmdb, mapping, season, type) {
          '''
          helper = '''async function findSeasonCandidateFromBaseRelations(baseAliases, seasonAliases) {
            const targets = new Map();
            for (const alias of seasonAliases || []) {
              const key = normalizeTitle(alias);
              if (key && !targets.has(key)) targets.set(key, alias);
            }
            if (!targets.size) return null;

            for (const baseAlias of baseAliases || []) {
              const results = await searchAnime(baseAlias);
              const baseKey = normalizeTitle(baseAlias);
              const baseCandidate = results.find(item => normalizeTitle(item.title) === baseKey);
              if (!baseCandidate) continue;

              const html = await fetchText(`${BASE_URL}/anime/${baseCandidate.slug}-${baseCandidate.numId}`, HEADERS);
              if (!html) continue;

              const pattern = /href=["'](?:https?:\\/\\/anidb\\.app)?\\/anime\\/([a-z0-9-]+)-(\\d+)["']/gi;
              let match;
              while ((match = pattern.exec(html)) !== null) {
                if (String(match[2]) === String(baseCandidate.numId)) continue;
                const slugKey = normalizeTitle(String(match[1]).replace(/-/g, " "));
                if (!targets.has(slugKey)) continue;
                return {
                  slug: match[1],
                  numId: match[2],
                  title: targets.get(slugKey),
                  matchedAlias: baseAlias,
                  relationSeasonMatch: true
                };
              }
            }
            return null;
          }

          async function resolveAnimeIdentity(tmdb, mapping, season, type) {
          '''
          if anchor not in s:
              raise SystemExit('resolveAnimeIdentity anchor missing')
          s = s.replace(anchor, helper, 1)

          old = '''    const broadSeasonMatch = await findSeasonCandidateFromBroadSearch(genericAliases, generatedAliases);
              if (broadSeasonMatch) {
                return { ...broadSeasonMatch, identitySource: "broad-exact-season" };
              }

              const mappedAliases = await buildMappedSeasonAliases(mapping);
          '''
          new = '''    const broadSeasonMatch = await findSeasonCandidateFromBroadSearch(genericAliases, generatedAliases);
              if (broadSeasonMatch) {
                return { ...broadSeasonMatch, identitySource: "broad-exact-season" };
              }

              // AniDB's suggestions can return only the base season even when a later-season
              // record exists. The base page already links its related/sequel records, so use
              // those links as a deterministic fallback and accept only an exact generated
              // season slug such as oshi-no-ko-season-2. No fuzzy title scoring is involved.
              const relationSeasonMatch = await findSeasonCandidateFromBaseRelations(genericAliases, generatedAliases);
              if (relationSeasonMatch) {
                return { ...relationSeasonMatch, identitySource: "relation-exact-season" };
              }

              const mappedAliases = await buildMappedSeasonAliases(mapping);
          '''
          if old not in s:
              raise SystemExit('broad season block missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest['version'] != '0.1.17':
              raise SystemExit(f"unexpected baseline {manifest['version']}")
          manifest['version'] = '0.1.18'
          ani = next(x for x in manifest['scrapers'] if x['id'] == 'anidb')
          if ani['version'] != '1.0.4':
              raise SystemExit(f"unexpected AniDB version {ani['version']}")
          ani['version'] = '1.0.5'
          ani['description'] = 'Limitless-maintained AniDB based on Eclipsia Praxiel runtime access, with exact S2+ discovery through direct search, base-title results, and AniDB relation links; MAL fallback and standardized DUB/HARDSUB labels.'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          lock_path = Path('sources-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['baseline'] = 'anime-v0.1.18'
          lock['frozenOn'] = '2026-08-24'
          entry = next(x for x in lock['providers'] if x['filename'] == 'anidb.js')
          entry['localVersion'] = '1.0.5'
          entry['notes'] = 'Praxiel-based runtime access. Later seasons use exact generated season aliases first, then exact candidates from broad search, then the base AniDB page relations/sequel links where the related slug must exactly match a generated season alias. This handles Oshi no Ko S2 when suggestions expose only S1, preserves Tanya S2 behavior, and keeps DUB/HARDSUB labels.'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')
          PY

          node --check providers/anidb.js

      - name: Gate Oshi relation fallback and Tanya regression
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const requests = [];
          function jsonResponse(body) { return { ok: true, status: 200, json: async () => body, text: async () => JSON.stringify(body) }; }
          function textResponse(body) { return { ok: true, status: 200, json: async () => { throw new Error('not json'); }, text: async () => body }; }

          global.fetch = async (url, options={}) => {
            const u = String(url);
            requests.push(u);

            if (u.includes('/3/tv/203737?')) return jsonResponse({
              name: 'Oshi no Ko', original_name: 'Oshi no Ko',
              external_ids: { imdb_id: 'tt21030032' }, genres: [{ id: 16 }], alternative_titles: { results: [] }
            });
            if (u.includes('/3/tv/69346?')) return jsonResponse({
              name: 'Saga of Tanya the Evil', original_name: '幼女戦記',
              external_ids: { imdb_id: 'tt6455986' }, genres: [{ id: 16 }], alternative_titles: { results: [] }
            });

            if (u.includes('id-mapping-api-malid') && u.includes('tt21030032')) return jsonResponse({ mal_id: 52034, mal_episode: 1, anime_title: 'Oshi no Ko' });
            if (u.includes('id-mapping-api-malid') && u.includes('tt6455986')) return jsonResponse({ mal_id: 32615, mal_episode: 1, anime_title: 'Youjo Senki' });
            if (u.includes('api.jikan.moe/v4/anime/52034')) return jsonResponse({ data: { title: 'Oshi no Ko', title_english: 'Oshi no Ko', titles: [] } });
            if (u.includes('api.jikan.moe/v4/anime/32615')) return jsonResponse({ data: { title: 'Youjo Senki', title_english: 'Saga of Tanya the Evil', titles: [] } });
            if (u.includes('graphql.anilist.co')) return jsonResponse({ data: { Media: { title: { english: null, romaji: null, native: null }, synonyms: [] } } });

            // Live-like Oshi behavior: all suggestion queries expose only the base record.
            if (u.includes('/search/suggestions') && u.toLowerCase().includes('oshi')) {
              return textResponse('<a href="/anime/oshi-no-ko-21"><img alt="[Oshi No Ko]"></a>');
            }
            // The base page carries the real sequel relation to S2.
            if (u === 'https://anidb.app/anime/oshi-no-ko-21') {
              return textResponse('<section><a href="/anime/oshi-no-ko-season-2-22">[Oshi No Ko] Season 2</a><a href="/anime/oshi-no-ko-season-3-23">[Oshi No Ko] Season 3</a></section>');
            }

            // Tanya must keep resolving directly via its Roman-numeral S2 record.
            if (u.includes('/search/suggestions?q=Saga%20of%20Tanya%20the%20Evil%20II')) {
              return textResponse('<a href="/anime/saga-of-tanya-the-evil-ii-6383"><img alt="Saga of Tanya the Evil II"></a>');
            }
            if (u.includes('/search/suggestions')) return textResponse('');

            if (u.includes('/api/frontend/anime/22/episodes')) return jsonResponse({ episodes: [{ id: 'oshi-s2e1', number: 1 }] });
            if (u.includes('/api/frontend/anime/6383/episodes')) return jsonResponse({ episodes: [{ id: 'tanya-s2e1', number: 1 }] });
            if (u.includes('/api/frontend/anime/21/episodes')) throw new Error('BUG: Oshi S2 collapsed to S1 record 21');
            if (u.includes('/api/frontend/anime/4517/episodes')) throw new Error('BUG: Tanya S2 collapsed to S1 record 4517');

            if (u.includes('/api/frontend/episode/oshi-s2e1/languages') || u.includes('/api/frontend/episode/tanya-s2e1/languages')) {
              const key = u.includes('oshi') ? 'oshi' : 'tanya';
              return jsonResponse([
                { code: 'eng', embed_url: `https://embed.test/${key}-eng` },
                { code: 'jpn', embed_url: `https://embed.test/${key}-jpn` }
              ]);
            }
            if (u.startsWith('https://embed.test/')) return textResponse("file: 'https://cdn.test/stream.m3u8'");

            throw new Error('Unhandled mock URL: ' + u);
          };

          const provider = require('./providers/anidb.js');
          (async () => {
            const oshi = await provider.getStreams('203737', 'tv', 2, 1);
            if (oshi.length !== 2) throw new Error('Oshi S2 expected 2 streams, got ' + oshi.length);
            if (!requests.some(x => x === 'https://anidb.app/anime/oshi-no-ko-21')) throw new Error('Oshi relation page not used');
            if (!requests.some(x => x.includes('/api/frontend/anime/22/episodes'))) throw new Error('Oshi did not select AniDB 22');
            if (requests.some(x => x.includes('/api/frontend/anime/21/episodes'))) throw new Error('Oshi selected AniDB 21');

            requests.length = 0;
            const tanya = await provider.getStreams('69346', 'tv', 2, 1);
            if (tanya.length !== 2) throw new Error('Tanya S2 expected 2 streams, got ' + tanya.length);
            if (!requests.some(x => x.includes('/api/frontend/anime/6383/episodes'))) throw new Error('Tanya did not select AniDB 6383');
            if (requests.some(x => x.includes('/api/frontend/anime/4517/episodes'))) throw new Error('Tanya selected AniDB 4517');

            console.log('PASS: Oshi S2 relation fallback -> 22; Tanya S2 remains -> 6383');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Validate repository and commit
        shell: bash
        run: |
          set -euo pipefail
          for f in providers/*.js; do node --check "$f" >/dev/null; done
          node -e "const m=require('./manifest.json'); if(m.version!=='0.1.18') process.exit(1); const a=m.scrapers.find(x=>x.id==='anidb'); if(!a||a.version!=='1.0.5') process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers/anidb.js manifest.json sources-lock.json
          git commit -m "Add AniDB relation-based later-season discovery [skip ci]"
          git push origin HEAD:Limitless-Nuviotest
