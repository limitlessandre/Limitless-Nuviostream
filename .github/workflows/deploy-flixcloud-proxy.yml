name: Deploy FlixCloud Proxy

on:
  workflow_dispatch:
  push:
    branches:
      - Limitless-nexus
    paths:
      - 'proxy/flixcloud/**'
      - '.github/workflows/deploy-flixcloud-proxy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy/flixcloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: proxy/flixcloud/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
