name: Temporary AniDB import trigger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-anidb-import.yml

permissions:
  contents: write
  issues: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2 --repo ${{ github.repository }} --body "AniDB guarded import started."

      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate AniDB index and provider
        id: build
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            pip install -q curl_cffi beautifulsoup4
            cat > /tmp/run_anidb_generator.py <<'PY'
          import re
          from pathlib import Path

          source = Path(".github/workflows/rebuild-anidb.yml").read_text(encoding="utf-8")
          match = re.search(r"          python3 - <<'PY'\n(.*?)\n          PY\n", source, re.S)
          if not match:
              raise SystemExit("Could not extract AniDB generator")
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in match.group(1).splitlines()
          ) + "\n"

          count_start = script.index("first = get_page(1)")
          count_end = script.index("\n\nby_id = {}", count_start)
          count_replacement = "first = get_page(1)\npages = 500\nprint('AniDB pagination total is not exposed; scanning until the catalog ends')"
          script = script[:count_start] + count_replacement + script[count_end:]

          loop_start = script.index("collect(first)\nfor page in range(2, pages + 1):")
          loop_end = script.index("\n\nif len(by_id) < 6000:", loop_start)
          loop_replacement = "collect(first)\nfor page in range(2, pages + 1):\n    try:\n        html = get_page(page)\n    except RuntimeError:\n        if len(by_id) >= 6000:\n            print(f'Catalog ended before page {page}: {len(by_id)} titles')\n            break\n        raise\n    before = len(by_id)\n    collect(html)\n    if len(by_id) == before:\n        if len(by_id) >= 6000:\n            print(f'Catalog repeated/ended at page {page}: {len(by_id)} titles')\n            break\n        raise SystemExit(f'AniDB browse page {page} added no new titles before minimum index size')\n    if page % 25 == 0:\n        print(f'Indexed page {page}: {len(by_id)} titles')\n    time.sleep(0.08)"
          script = script[:loop_start] + loop_replacement + script[loop_end:]

          exec(compile(script, "anidb-import.py", "exec"), {})
          PY
            python3 /tmp/run_anidb_generator.py
            node --check providers/anidb.js
          } 2>&1 | tee anidb-build.log

      - name: Validate season mapping and playback
        id: playback
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            node <<'NODE'
          const provider = require('./providers/anidb.js');

          async function check(id, title, season, episode) {
            const streams = await provider.getStreams(id, 'tv', season, episode);
            const label = `${title} S${season}E${episode}`;
            console.log(`\n${label}: ${streams.length} streams`);
            for (const s of streams) {
              console.log(`${s.name} :: ${s.title || ''} :: ${s.url}`);
            }
            if (!Array.isArray(streams) || streams.length < 2) {
              throw new Error(`${label}: expected DUB + HARDSUB`);
            }
            if (!streams.some(s => /\[DUB\]/.test(s.name))) {
              throw new Error(`${label}: missing DUB`);
            }
            if (!streams.some(s => /\[HARDSUB\]/.test(s.name))) {
              throw new Error(`${label}: missing HARDSUB`);
            }
            if (!streams.every(s => String(s.title || '').includes(`S${season}E${episode}`))) {
              throw new Error(`${label}: result lost requested identity`);
            }
            for (const stream of streams) {
              if (stream.type !== 'm3u8') {
                throw new Error(`${label}: wrong stream type`);
              }
              const response = await fetch(stream.url, { headers: stream.headers });
              const body = await response.text();
              if (!response.ok || !body.trim().startsWith('#EXTM3U')) {
                throw new Error(`${label}: invalid HLS master`);
              }
            }
            return streams;
          }

          (async () => {
            const s1 = await check('69346', 'Saga of Tanya the Evil', 1, 1);
            const s2 = await check('69346', 'Saga of Tanya the Evil', 2, 1);
            const s1Urls = new Set(s1.map(x => x.url));
            if (s2.some(x => s1Urls.has(x.url))) {
              throw new Error('Tanya S2E1 reused S1E1 playback URL');
            }
            await check('209867', "Frieren: Beyond Journey's End", 1, 1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          } 2>&1 | tee anidb-playback.log

      - name: Validate repository and commit test branch
        id: commit
        if: steps.build.outcome == 'success' && steps.playback.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          lock = json.loads(Path("sources-lock.json").read_text(encoding="utf-8"))
          assert manifest["version"] == "0.1.15"
          assert lock["baseline"] == "anime-v0.1.15"
          assert len(manifest["scrapers"]) == 17
          ani = next(item for item in manifest["scrapers"] if item["id"] == "anidb")
          assert ani["version"] == "1.0.2"
          PY
            for file in providers/*.js; do
              node --check "$file" >/dev/null
            done
            rm -f .anidb-*.txt
            rm -f .github/workflows/*anidb*.yml
            rm -f anidb-build.log anidb-playback.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
            git commit -m "Import season-aware AniDB provider [skip ci]"
            git push origin HEAD:Limitless-Nuviotest
          } 2>&1 | tee anidb-commit.log

      - name: Report outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.build.outcome }}
          PLAYBACK: ${{ steps.playback.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
        shell: bash
        run: |
          {
            echo "AniDB import outcome: build=${BUILD:-skipped}, playback=${PLAYBACK:-skipped}, commit=${COMMIT:-skipped}"
            echo
            for file in anidb-build.log anidb-playback.log anidb-commit.log; do
              if [ -f "$file" ]; then
                echo "### $file tail"
                echo '```'
                tail -n 35 "$file"
                echo '```'
              fi
            done
          } > /tmp/anidb-report.txt
          gh issue comment 2 --repo ${{ github.repository }} --body-file /tmp/anidb-report.txt
