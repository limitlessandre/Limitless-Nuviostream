name: Apply 123Anime semantic dedupe

on:
  push:
    branches: [Limitless-Nuviotest]
    paths:
      - .github/workflows/collapse-123anime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest
      - name: Collapse identical player outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('providers/123anime.js')
          s = p.read_text()
          old = '''    const routeKey = `${variants[i]}|${finalUrl}`;
    if (!finalUrl || seen.has(routeKey)) continue;
    seen.add(routeKey);'''
          new = '''    // Try every player route, but only expose a second entry when it resolves
    // to a materially different final stream.
    const routeKey = finalUrl;
    if (!finalUrl || seen.has(routeKey)) continue;
    seen.add(routeKey);'''
          if old not in s:
              raise SystemExit('local player dedupe anchor not found')
          s = s.replace(old, new, 1)

          old = '''    const seen = new Set();
    const out = all.flat().filter(stream => {
      const key = `${stream.url}|${stream.language}|${stream.name}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });'''
          new = '''    const seen = new Set();
    const out = all.flat().filter(stream => {
      const headerKey = Object.entries(stream.headers || {})
        .sort(([a], [b]) => a.localeCompare(b))
        .map(([k, v]) => `${k.toLowerCase()}=${v}`)
        .join('&');
      const subtitleKey = (stream.subtitles || [])
        .map(sub => `${sub.language || ''}|${sub.url || ''}`)
        .sort()
        .join(',');
      // Player/server labels are intentionally excluded. If JW, Legacy, SBv2,
      // F5, etc. resolve to the same media with the same playback semantics,
      // Nuvio only needs one entry. Distinct URLs/headers/subtitles remain visible.
      const key = `${stream.url}|${stream.language}|${headerKey}|${subtitleKey}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });'''
          if old not in s:
              raise SystemExit('global dedupe anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          m = Path('manifest.json')
          data = json.loads(m.read_text())
          data['version'] = '0.1.14'
          for scraper in data.get('scrapers', []):
              if scraper.get('id') == 'limitless-123anime':
                  scraper['version'] = '1.1.1'
                  scraper['description'] = 'Limitless AniYomi-to-Nuvio port of 123Anime with season-aware MAL mapping, exact aliases, DUB/HARDSUB labeling, mirror failover, and JW/Legacy/SBv2 fallback extraction with semantic duplicate collapsing.'
          m.write_text(json.dumps(data, indent=2) + '\n')

          l = Path('sources-lock.json')
          lock = json.loads(l.read_text())
          lock['baseline'] = 'anime-v0.1.14'
          for provider in lock.get('providers', []):
              if provider.get('filename') == '123anime.js':
                  provider['localVersion'] = '1.1.1'
                  provider['notes'] = 'AniYomi-to-Nuvio port. Tries JW, Legacy, and SBv2 internally for resilience, but collapses outputs that resolve to the same final media URL with the same headers/audio/subtitle semantics. Distinct routes remain visible. Japanese burned-in subtitle streams are labeled HARDSUB.'
          l.write_text(json.dumps(lock, indent=2) + '\n')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/collapse-123anime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers/123anime.js manifest.json sources-lock.json .github/workflows/collapse-123anime.yml
          git commit -m "Collapse duplicate 123Anime player outputs [skip ci]"
          git push origin HEAD:Limitless-Nuviotest
