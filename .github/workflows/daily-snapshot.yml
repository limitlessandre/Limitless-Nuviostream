name: Daily adult-only snapshot
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run build:snapshot
      # Deploy only after build-snapshot succeeds. Keep the prior deployed current.json on failure.
