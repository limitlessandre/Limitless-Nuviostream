name: AllAnime Bootstrap Body

on:
  push:
    branches: [Limitless-Nuviotest]
    paths: [.github/workflows/allanime-bootstrap-body.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect bootstrap rejection
        shell: bash
        run: |
          node <<'NODE' > allanime-bootstrap-body.txt 2>&1
          const fs=require('fs'),Module=require('module'),path=require('path');
          let code=fs.readFileSync('providers/allanime.js','utf8');
          code+=`\nmodule.exports.__b={resolveBuild,maskCandidates,epochCandidates,skewedEpochCandidates,bootTokenNew,bootTokenLegacy};\n`;
          const mod=new Module(path.resolve('providers/allanime-bootstrap-runtime.js'),module);mod.filename=path.resolve('providers/allanime-bootstrap-runtime.js');mod.paths=module.paths;mod._compile(code,mod.filename);
          const d=mod.exports.__b;
          (async()=>{
            const build=await d.resolveBuild();console.log('BUILD',JSON.stringify(build));
            const masks=d.maskCandidates(build.buildId,build.seeds);console.log('MASKS',masks.length);
            const epochs=[...new Set([...d.epochCandidates(),...d.skewedEpochCandidates()])];console.log('EPOCHS',epochs);
            for(let mi=0;mi<masks.length;mi++)for(const epoch of epochs)for(const kind of ['new','legacy']){
              const token=kind==='new'?await d.bootTokenNew(masks[mi],build.buildId,epoch):await d.bootTokenLegacy(masks[mi],build.buildId,epoch);
              const url=`https://api.mkissa.net/client-crypto/v1/bootstrap?buildId=${encodeURIComponent(build.buildId)}&k=k7`;
              const r=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0','Origin':'https://mkissa.to','Referer':'https://mkissa.to/','x-build-id':build.buildId,'x-aa-boot':token}});
              const text=await r.text();console.log('TRY',JSON.stringify({mask:mi,epoch,kind,status:r.status,tokenPrefix:token.slice(0,16),body:text.slice(0,500)}));
              if(r.ok)return;
            }
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
          cat allanime-bootstrap-body.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add allanime-bootstrap-body.txt
          git commit -m "Record temporary MKissa bootstrap response [skip ci]" || exit 0
          git pull --rebase origin Limitless-Nuviotest
          git push origin HEAD:Limitless-Nuviotest
