name: Probe HentaiHaven XXX Markup

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-providers
    paths:
      - '.github/workflows/probe-hentaihaven-xxx.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Jimihen pages
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          title='https://hentaihaven.xxx/watch/jimihen-jimiko-o-kae-chau-jun-isei-kouyuu/'
          episode='https://hentaihaven.xxx/watch/jimihen-jimiko-o-kae-chau-jun-isei-kouyuu/episode-1/'

          for pair in "title:$title" "episode:$episode"; do
            name="${pair%%:*}"
            url="${pair#*:}"
            file="/tmp/${name}.html"
            status="$(curl -L --silent --show-error --max-time 30 -A "$UA" -e 'https://hentaihaven.xxx/hentai/' -o "$file" -w '%{http_code}' "$url" || true)"
            echo "=== $name status=$status bytes=$(wc -c < "$file" 2>/dev/null || echo 0) ==="
            grep -oiE '<iframe[^>]{0,500}|https?://[^"'"'"' <]+|/wp-admin/admin-ajax\.php|player[^"'"'"' <]{0,160}|action\s*:[^,]{0,100}|episode-[0-9]+' "$file" 2>/dev/null | head -n 120 || true
            echo
          done
