name: Run corrected AniDB rebuild

on:
  push:
    branches: [Limitless-Nuviotest]
    paths:
      - .github/workflows/run-anidb-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate frozen AniDB index and provider
        shell: bash
        run: |
          set -euo pipefail
          pip install -q curl_cffi beautifulsoup4
          python3 - <<'PY'
          import re, textwrap
          from pathlib import Path
          source = Path('.github/workflows/rebuild-anidb.yml').read_text(encoding='utf-8')
          match = re.search(r"          python3 - <<'PY'\n(.*?)\n          PY\n", source, re.S)
          if not match:
              raise SystemExit('Could not extract AniDB rebuild generator')
          script = textwrap.dedent(match.group(1))
          exec(compile(script, 'anidb-rebuild-generator.py', 'exec'), {})
          PY
          node --check providers/anidb.js

      - name: Validate Tanya and Frieren end to end
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const provider = require('./providers/anidb.js');
          async function check(id, title) {
            const out = await provider.getStreams(id, 'tv', 1, 1);
            console.log(title, out.map(x => `${x.name} :: ${x.url}`).join('\n'));
            if (!Array.isArray(out) || out.length < 2) throw new Error(`${title}: expected DUB + HARDSUB`);
            if (!out.some(x => /\[DUB\]/.test(x.name))) throw new Error(`${title}: DUB missing`);
            if (!out.some(x => /\[HARDSUB\]/.test(x.name))) throw new Error(`${title}: HARDSUB missing`);
            for (const stream of out) {
              if (stream.type !== 'm3u8') throw new Error(`${title}: stream type is not m3u8`);
              const response = await fetch(stream.url, { headers: stream.headers });
              const body = await response.text();
              console.log(`${title} ${stream.name}: HTTP ${response.status}, ${response.headers.get('content-type')}`);
              if (!response.ok || !body.trim().startsWith('#EXTM3U')) throw new Error(`${title}: invalid HLS master`);
            }
          }
          (async () => {
            await check('69346', 'Saga of Tanya the Evil');
            await check('209867', "Frieren: Beyond Journey's End");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          lock = json.loads(Path('sources-lock.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '0.1.15'
          assert lock['baseline'] == 'anime-v0.1.15'
          assert len(manifest['scrapers']) == 17
          ani = next(x for x in manifest['scrapers'] if x['id'] == 'anidb')
          assert ani['version'] == '1.0.2'
          PY
          for file in providers/*.js; do node --check "$file" >/dev/null; done

      - name: Clean probes and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .anidb-*.txt
          rm -f .github/workflows/probe-anidb*.yml
          rm -f .github/workflows/rebuild-anidb.yml
          rm -f .github/workflows/run-anidb-rebuild.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No AniDB changes to commit'; exit 1; }
          git commit -m "Rebuild AniDB around frozen exact index [skip ci]"
          git push origin HEAD:Limitless-Nuviotest
