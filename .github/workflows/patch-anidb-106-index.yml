name: Build AniDB frozen identity index 1.0.6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-anidb-106-index.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Crawl AniDB catalog and embed exact identity index
        shell: bash
        run: |
          set -euo pipefail
          pip install -q curl_cffi beautifulsoup4
          python3 <<'PY'
          import json, re, time, unicodedata
          from html import unescape
          from pathlib import Path
          from bs4 import BeautifulSoup
          from curl_cffi import requests

          BASE = 'https://anidb.app'
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36'
          HEADERS = {'User-Agent': UA, 'Referer': BASE + '/', 'Accept': 'text/html,application/xhtml+xml'}

          def norm(value):
              value = unicodedata.normalize('NFKD', str(value or ''))
              value = ''.join(ch for ch in value if not unicodedata.combining(ch)).lower()
              value = value.replace('&', ' and ')
              value = re.sub(r'[^a-z0-9\u3040-\u30ff\u3400-\u9fff]+', ' ', value)
              return re.sub(r'\s+', ' ', value).strip()

          by_id = {}
          def collect(html):
              soup = BeautifulSoup(html, 'html.parser')
              before = len(by_id)
              for a in soup.find_all('a', href=True):
                  href = str(a.get('href') or '')
                  m = re.search(r'(?:https?://anidb\.app)?/anime/([a-z0-9-]+)-(\d+)(?:[?#].*)?$', href, re.I)
                  if not m:
                      continue
                  slug, num_id = m.group(1).lower(), m.group(2)
                  img = a.find('img')
                  title = ''
                  if img and img.get('alt'):
                      title = unescape(str(img.get('alt'))).strip()
                  if not title:
                      title = unescape(a.get_text(' ', strip=True)).strip()
                  if not title:
                      title = slug.replace('-', ' ')
                  by_id[num_id] = {'slug': slug, 'id': num_id, 'title': title}
              return len(by_id) - before

          session = requests.Session(impersonate='chrome')
          for page in range(1, 501):
              url = f'{BASE}/browse?page={page}'
              r = session.get(url, headers=HEADERS, timeout=30)
              if r.status_code != 200:
                  if len(by_id) >= 6000:
                      print(f'Catalog ended at page {page} with HTTP {r.status_code}; {len(by_id)} titles')
                      break
                  raise SystemExit(f'AniDB browse failed on page {page}: HTTP {r.status_code}')
              added = collect(r.text)
              if page % 20 == 0:
                  print(f'Indexed page {page}: {len(by_id)} titles')
              if added == 0:
                  if len(by_id) >= 6000:
                      print(f'Catalog repeated/ended at page {page}: {len(by_id)} titles')
                      break
                  raise SystemExit(f'Page {page} added zero titles before minimum catalog size')
              time.sleep(0.04)

          if len(by_id) < 6000:
              raise SystemExit(f'Index too small: {len(by_id)} titles')

          index = {}
          for item in by_id.values():
              keys = {norm(item['slug'].replace('-', ' ')), norm(item['title'])}
              for key in keys:
                  if not key:
                      continue
                  bucket = index.setdefault(key, [])
                  compact = [item['slug'], item['id'], item['title']]
                  if compact not in bucket:
                      bucket.append(compact)

          def has_id(key, wanted):
              return any(str(row[1]) == str(wanted) for row in index.get(norm(key), []))

          if not has_id('Oshi no Ko Season 2', '22'):
              raise SystemExit('Frozen index missing Oshi no Ko Season 2 / AniDB 22')
          if not has_id('Saga of Tanya the Evil II', '6383'):
              raise SystemExit('Frozen index missing Tanya II / AniDB 6383')

          print(f'Frozen identity index: {len(by_id)} titles, {len(index)} normalized keys')

          p = Path('providers/anidb.js')
          s = p.read_text(encoding='utf-8')
          if '// Limitless AniDB 1.0.5' not in s:
              raise SystemExit('Unexpected AniDB provider version')
          s = s.replace('// Limitless AniDB 1.0.5', '// Limitless AniDB 1.0.6', 1)

          header_anchor = '''const HEADERS = {
            "User-Agent": USER_AGENT,
            "Referer": BASE_URL + "/",
            "Accept": "application/json, text/plain, */*"
          };
          '''
          if header_anchor not in s:
              raise SystemExit('HEADERS anchor missing')
          embedded = header_anchor + '\n// Frozen AniDB.app identity index generated 2026-08-24.\n' + 'const ANIDB_INDEX = ' + json.dumps(index, ensure_ascii=False, separators=(',', ':')) + ';\n'
          s = s.replace(header_anchor, embedded, 1)

          resolve_start = s.find('async function resolveAnimeIdentity(')
          resolve_end = s.find('\nasync function resolveEpisodeId(', resolve_start)
          if resolve_start < 0 or resolve_end < 0:
              raise SystemExit('resolveAnimeIdentity anchors missing')

          replacement = r'''async function findIndexedCandidate(aliases, malId, requireMalVerification) {
            for (const alias of aliases || []) {
              const rows = ANIDB_INDEX[normalizeTitle(alias)] || [];
              if (!rows.length) continue;
              const candidates = rows.map(row => ({ slug: row[0], numId: row[1], title: row[2], matchedAlias: alias }));

              if (!requireMalVerification || !malId) {
                if (candidates.length === 1) return { ...candidates[0], identitySource: "frozen-index" };
                // When multiple exact normalized keys exist, prefer an exact normalized title match.
                const exact = candidates.find(item => normalizeTitle(item.title) === normalizeTitle(alias));
                if (exact) return { ...exact, identitySource: "frozen-index" };
              }

              if (malId) {
                for (const candidate of candidates) {
                  if (await verifyCandidateMal(candidate, malId)) {
                    return { ...candidate, identitySource: "frozen-index-verified" };
                  }
                }
              }
            }
            return null;
          }

          async function resolveAnimeIdentity(tmdb, mapping, season, type) {
            const malId = mapping && mapping.mal_id ? Number(mapping.mal_id) : null;
            const seasonNumber = Number(season) || 1;
            const genericAliases = buildGenericAliases(tmdb);
            const genericKeys = new Set(genericAliases.map(normalizeTitle));

            if (type === "tv" && seasonNumber > 1) {
              // Primary path: frozen exact season identity. This avoids AniDB's inconsistent
              // suggestions endpoint and HTML relation pages entirely for known titles.
              const generatedAliases = buildGeneratedSeasonAliases(tmdb, seasonNumber, type);
              const frozenSeason = await findIndexedCandidate(generatedAliases, null, false);
              if (frozenSeason) return { ...frozenSeason, identitySource: "frozen-generated-season" };

              const mappedAliases = await buildMappedSeasonAliases(mapping);
              const frozenMapped = await findIndexedCandidate(mappedAliases, malId, false);
              if (frozenMapped && !genericKeys.has(normalizeTitle(frozenMapped.title))) {
                return { ...frozenMapped, identitySource: "frozen-mapped-season" };
              }

              // Network fallbacks remain for titles added after the frozen index was generated.
              const generatedMatch = await findCandidate(generatedAliases, null, false);
              if (generatedMatch) return { ...generatedMatch, identitySource: "generated-season" };

              const broadSeasonMatch = await findSeasonCandidateFromBroadSearch(genericAliases, generatedAliases);
              if (broadSeasonMatch) return { ...broadSeasonMatch, identitySource: "broad-exact-season" };

              const relationSeasonMatch = await findSeasonCandidateFromBaseRelations(genericAliases, generatedAliases);
              if (relationSeasonMatch) return { ...relationSeasonMatch, identitySource: "relation-exact-season" };

              const mappedMatch = await findCandidate(mappedAliases, malId, false);
              if (mappedMatch && !genericKeys.has(normalizeTitle(mappedMatch.title))) {
                return { ...mappedMatch, identitySource: "mapped-season" };
              }
              return null;
            }

            const mappedAliases = await buildMappedSeasonAliases(mapping);
            const frozenMapped = await findIndexedCandidate(mappedAliases, malId, false);
            if (frozenMapped) return { ...frozenMapped, identitySource: "frozen-mapped" };

            const frozenGeneric = await findIndexedCandidate(genericAliases, malId, !!malId);
            if (frozenGeneric) return { ...frozenGeneric, identitySource: "frozen-generic" };

            if (mappedAliases.length) {
              const mappedMatch = await findCandidate(mappedAliases, malId, false);
              if (mappedMatch) return { ...mappedMatch, identitySource: "mapped" };
            }
            if (malId) {
              const verified = await findCandidate(genericAliases, malId, true);
              return verified ? { ...verified, identitySource: "generic-verified" } : null;
            }
            if (type === "movie" || seasonNumber === 1) {
              const exact = await findCandidate(genericAliases, null, false);
              return exact ? { ...exact, identitySource: "generic" } : null;
            }
            return null;
          }
          '''
          s = s[:resolve_start] + replacement + s[resolve_end:]
          p.write_text(s, encoding='utf-8')

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest['version'] != '0.1.18':
              raise SystemExit(f"Unexpected baseline {manifest['version']}")
          manifest['version'] = '0.1.19'
          ani = next(x for x in manifest['scrapers'] if x['id'] == 'anidb')
          if ani['version'] != '1.0.5':
              raise SystemExit(f"Unexpected AniDB version {ani['version']}")
          ani['version'] = '1.0.6'
          ani['description'] = 'Limitless-maintained AniDB using Eclipsia Praxiel playback access plus a frozen exact AniDB.app identity index for deterministic season matching, with network discovery only as a fallback and standardized DUB/HARDSUB labels.'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          lock_path = Path('sources-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['baseline'] = 'anime-v0.1.19'
          lock['frozenOn'] = '2026-08-24'
          entry = next(x for x in lock['providers'] if x['filename'] == 'anidb.js')
          entry['localVersion'] = '1.0.6'
          entry['notes'] = 'Hybrid AniDB provider: Praxiel runtime playback/API behavior is retained, while identity resolution now uses a frozen exact AniDB.app catalog index generated on 2026-08-24. This removes suggestions/relation-page dependence for indexed titles, keeps finite non-fuzzy season aliases, and leaves live search only as a future-title fallback.'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')
          PY

          node --check providers/anidb.js
          wc -c providers/anidb.js

      - name: Gate Oshi S2 and Tanya S2 without any discovery network
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const requests = [];
          const jsonResponse = body => ({ ok:true, status:200, json:async()=>body, text:async()=>JSON.stringify(body) });
          const textResponse = body => ({ ok:true, status:200, json:async()=>{ throw new Error('not json'); }, text:async()=>body });

          global.fetch = async (url, options={}) => {
            const u = String(url); requests.push(u);
            if (u.includes('/3/tv/203737?')) return jsonResponse({ name:'Oshi no Ko', original_name:'Oshi no Ko', external_ids:{imdb_id:'tt21030032'}, genres:[{id:16}], alternative_titles:{results:[]} });
            if (u.includes('/3/tv/69346?')) return jsonResponse({ name:'Saga of Tanya the Evil', original_name:'幼女戦記', external_ids:{imdb_id:'tt6455986'}, genres:[{id:16}], alternative_titles:{results:[]} });
            if (u.includes('id-mapping-api-malid') && u.includes('tt21030032')) return jsonResponse({ mal_id:52034, mal_episode:1, anime_title:'Oshi no Ko' });
            if (u.includes('id-mapping-api-malid') && u.includes('tt6455986')) return jsonResponse({ mal_id:32615, mal_episode:1, anime_title:'Youjo Senki' });

            if (u.includes('/search/suggestions') || /^https:\/\/anidb\.app\/anime\//.test(u)) throw new Error('BUG: discovery network was used: ' + u);

            if (u.includes('/api/frontend/anime/22/episodes')) return jsonResponse({ episodes:[{id:'oshi-s2e1',number:1}] });
            if (u.includes('/api/frontend/anime/6383/episodes')) return jsonResponse({ episodes:[{id:'tanya-s2e1',number:1}] });
            if (u.includes('/api/frontend/anime/21/episodes')) throw new Error('BUG: Oshi S2 selected S1');
            if (u.includes('/api/frontend/anime/4517/episodes')) throw new Error('BUG: Tanya S2 selected S1');
            if (u.includes('/api/frontend/episode/oshi-s2e1/languages') || u.includes('/api/frontend/episode/tanya-s2e1/languages')) {
              const key = u.includes('oshi') ? 'oshi' : 'tanya';
              return jsonResponse([{code:'eng',embed_url:`https://embed.test/${key}-eng`},{code:'jpn',embed_url:`https://embed.test/${key}-jpn`}]);
            }
            if (u.startsWith('https://embed.test/')) return textResponse("file: 'https://cdn.test/stream.m3u8'");
            throw new Error('Unhandled URL ' + u);
          };

          const provider = require('./providers/anidb.js');
          (async()=>{
            const oshi = await provider.getStreams('203737','tv',2,1);
            if (oshi.length !== 2) throw new Error('Oshi expected 2 streams, got ' + oshi.length);
            if (!requests.some(x=>x.includes('/api/frontend/anime/22/episodes'))) throw new Error('Oshi did not select AniDB 22');
            if (requests.some(x=>x.includes('/search/suggestions'))) throw new Error('Oshi used suggestions');

            requests.length = 0;
            const tanya = await provider.getStreams('69346','tv',2,1);
            if (tanya.length !== 2) throw new Error('Tanya expected 2 streams, got ' + tanya.length);
            if (!requests.some(x=>x.includes('/api/frontend/anime/6383/episodes'))) throw new Error('Tanya did not select AniDB 6383');
            if (requests.some(x=>x.includes('/search/suggestions'))) throw new Error('Tanya used suggestions');

            for (const streams of [oshi,tanya]) {
              if (!streams.some(x=>x.name.includes('[DUB]'))) throw new Error('Missing DUB');
              if (!streams.some(x=>x.name.includes('[HARDSUB]'))) throw new Error('Missing HARDSUB');
            }
            console.log('PASS: frozen index resolves Oshi S2 -> 22 and Tanya S2 -> 6383 with no discovery network');
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE

      - name: Validate and commit test branch
        shell: bash
        run: |
          set -euo pipefail
          for f in providers/*.js; do node --check "$f" >/dev/null; done
          node -e "const m=require('./manifest.json'); if(m.version!=='0.1.19')process.exit(1); const a=m.scrapers.find(x=>x.id==='anidb'); if(!a||a.version!=='1.0.6')process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers/anidb.js manifest.json sources-lock.json
          git commit -m "Use frozen exact AniDB identity index [skip ci]"
          git push origin HEAD:Limitless-Nuviotest
