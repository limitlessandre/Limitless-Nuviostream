name: Patch AniDB season identity 1.0.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-anidb-103.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Patch AniDB identity logic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('providers/anidb.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('// Limitless AniDB 1.0.2', '// Limitless AniDB 1.0.3', 1)

          old = '''async function buildSeasonAliases(tmdb, mapping, season, type) {
            const malId = mapping && mapping.mal_id ? Number(mapping.mal_id) : null;
            const metadataAliases = malId
              ? await Promise.all([fetchJikanAliases(malId), fetchAniListAliases(malId)])
              : [[], []];

            const generated = [];
            if (type === "tv" && Number(season) > 1 && tmdb && tmdb.title) {
              generated.push(
                `${tmdb.title} ${roman(season)}`,
                `${tmdb.title} Season ${season}`,
                `${tmdb.title} ${ordinal(season)} Season`
              );
            }

            return unique([
              mapping && mapping.anime_title,
              ...metadataAliases[0],
              ...metadataAliases[1],
              ...generated
            ]).slice(0, 18);
          }
          '''
          new = '''function buildGeneratedSeasonAliases(tmdb, season, type) {
            if (type !== "tv" || Number(season) <= 1 || !tmdb || !tmdb.title) return [];
            return unique([
              `${tmdb.title} ${roman(season)}`,
              `${tmdb.title} Season ${season}`,
              `${tmdb.title} ${ordinal(season)} Season`
            ]);
          }

          async function buildMappedSeasonAliases(mapping) {
            const malId = mapping && mapping.mal_id ? Number(mapping.mal_id) : null;
            const metadataAliases = malId
              ? await Promise.all([fetchJikanAliases(malId), fetchAniListAliases(malId)])
              : [[], []];
            return unique([
              mapping && mapping.anime_title,
              ...metadataAliases[0],
              ...metadataAliases[1]
            ]).slice(0, 15);
          }
          '''
          if old not in s:
              raise SystemExit('buildSeasonAliases anchor not found')
          s = s.replace(old, new, 1)

          old = '''async function resolveAnimeIdentity(tmdb, mapping, season, type) {
            const malId = mapping && mapping.mal_id ? Number(mapping.mal_id) : null;
            const seasonAliases = await buildSeasonAliases(tmdb, mapping, season, type);

            if (seasonAliases.length) {
              const seasonMatch = await findCandidate(seasonAliases, malId, false);
              if (seasonMatch) return seasonMatch;
            }

            // For mapped episodes, generic-title fallback is allowed only when the candidate
            // can be verified against the mapped MAL entry. This prevents S2 from falling into S1.
            const genericAliases = buildGenericAliases(tmdb);
            if (malId) {
              return await findCandidate(genericAliases, malId, true);
            }

            // If season mapping is unavailable, only season 1/movie may use an exact generic title.
            if (type === "movie" || Number(season) === 1) {
              return await findCandidate(genericAliases, null, false);
            }

            return null;
          }
          '''
          new = '''async function resolveAnimeIdentity(tmdb, mapping, season, type) {
            const malId = mapping && mapping.mal_id ? Number(mapping.mal_id) : null;
            const seasonNumber = Number(season) || 1;
            const genericAliases = buildGenericAliases(tmdb);
            const genericKeys = new Set(genericAliases.map(normalizeTitle));

            // AniDB.app stores many later seasons as separate anime records. For S2+,
            // try explicit season-shaped titles before trusting MAL mapping, because the
            // mapping service can lag behind newly separated seasons.
            if (type === "tv" && seasonNumber > 1) {
              const generatedAliases = buildGeneratedSeasonAliases(tmdb, seasonNumber, type);
              const generatedMatch = await findCandidate(generatedAliases, null, false);
              if (generatedMatch) {
                return { ...generatedMatch, identitySource: "generated-season" };
              }

              const mappedAliases = await buildMappedSeasonAliases(mapping);
              const mappedMatch = await findCandidate(mappedAliases, malId, false);
              if (mappedMatch && !genericKeys.has(normalizeTitle(mappedMatch.title))) {
                return { ...mappedMatch, identitySource: "mapped-season" };
              }

              // Correctness beats a false positive: never collapse S2+ back to the generic
              // base-series record just because that record also contains episode 1.
              return null;
            }

            const mappedAliases = await buildMappedSeasonAliases(mapping);
            if (mappedAliases.length) {
              const mappedMatch = await findCandidate(mappedAliases, malId, false);
              if (mappedMatch) return { ...mappedMatch, identitySource: "mapped" };
            }

            if (malId) {
              const verified = await findCandidate(genericAliases, malId, true);
              return verified ? { ...verified, identitySource: "generic-verified" } : null;
            }

            if (type === "movie" || seasonNumber === 1) {
              const exact = await findCandidate(genericAliases, null, false);
              return exact ? { ...exact, identitySource: "generic" } : null;
            }

            return null;
          }
          '''
          if old not in s:
              raise SystemExit('resolveAnimeIdentity anchor not found')
          s = s.replace(old, new, 1)

          old = '''    const mapping = await mapMalEpisode(tmdb.imdb, requestedSeason, requestedEpisode);
              const targetEpisode = type === "movie"
                ? 1
                : (mapping && mapping.mal_episode != null ? Number(mapping.mal_episode) : requestedEpisode);

              const candidate = await resolveAnimeIdentity(tmdb, mapping, requestedSeason, type);
          '''
          new = '''    const mapping = await mapMalEpisode(tmdb.imdb, requestedSeason, requestedEpisode);

              const candidate = await resolveAnimeIdentity(tmdb, mapping, requestedSeason, type);
          '''
          if old not in s:
              raise SystemExit('targetEpisode anchor not found')
          s = s.replace(old, new, 1)

          old = '''    const episodeId = await resolveEpisodeId(candidate.numId, targetEpisode);
              if (!episodeId) return [];
          '''
          new = '''    // AniDB.app's separated season records normally restart at episode 1.
              // Prefer the requested local episode. MAL episode numbering is only a fallback.
              let episodeId = await resolveEpisodeId(candidate.numId, requestedEpisode);
              if (!episodeId && mapping && mapping.mal_episode != null && Number(mapping.mal_episode) !== requestedEpisode) {
                episodeId = await resolveEpisodeId(candidate.numId, Number(mapping.mal_episode));
              }
              if (!episodeId) return [];
          '''
          if old not in s:
              raise SystemExit('episode resolve anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest['version'] != '0.1.15':
              raise SystemExit(f"unexpected baseline {manifest['version']}")
          manifest['version'] = '0.1.16'
          ani = next(x for x in manifest['scrapers'] if x['id'] == 'anidb')
          if ani['version'] != '1.0.2':
              raise SystemExit(f"unexpected AniDB version {ani['version']}")
          ani['version'] = '1.0.3'
          ani['description'] = 'Limitless-maintained AniDB based on Eclipsia Praxiel runtime access, with S2+ season-shaped identity priority, MAL fallback, and standardized DUB/HARDSUB labels.'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          lock_path = Path('sources-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['baseline'] = 'anime-v0.1.16'
          lock['frozenOn'] = '2026-08-24'
          entry = next(x for x in lock['providers'] if x['filename'] == 'anidb.js')
          entry['localVersion'] = '1.0.3'
          entry['notes'] = 'Rebuilt from Eclipsia Praxiel 1.1.0 runtime access/extraction behavior. S2+ now tries exact season-shaped aliases before MAL metadata, rejects collapse to the generic base-series record, and prefers the requested episode number inside the selected AniDB season record before MAL episode fallback. Uses standardized English [DUB] / Japanese [HARDSUB] labels.'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')
          PY

          node --check providers/anidb.js

      - name: Gate against stale MAL mapping
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const requests = [];
          function response(body, type='json') {
            return { ok: true, status: 200, json: async () => body, text: async () => String(body) };
          }

          global.fetch = async (url, options={}) => {
            const u = String(url);
            requests.push(u);
            if (u.includes('/3/tv/69346?')) {
              return response({
                name: 'Saga of Tanya the Evil',
                original_name: '幼女戦記',
                external_ids: { imdb_id: 'tt6455986' },
                genres: [{ id: 16 }],
                alternative_titles: { results: [] }
              });
            }
            if (u.includes('id-mapping-api-malid') && u.includes('s=2') && u.includes('e=1')) {
              // Deliberately stale/wrong season mapping: this is the bug we saw live.
              return response({ mal_id: 32615, mal_episode: 1, anime_title: 'Youjo Senki' });
            }
            if (u.includes('api.jikan.moe/v4/anime/32615')) {
              return response({ data: { title: 'Youjo Senki', title_english: 'Saga of Tanya the Evil', titles: [] } });
            }
            if (u.includes('graphql.anilist.co')) {
              return response({ data: { Media: { title: { english: 'Saga of Tanya the Evil', romaji: 'Youjo Senki', native: '幼女戦記' }, synonyms: [] } } });
            }
            if (u.includes('/search/suggestions?q=Saga%20of%20Tanya%20the%20Evil%20II')) {
              return response('<a href="/anime/saga-of-tanya-the-evil-ii-6383"><img alt="Saga of Tanya the Evil II"></a>', 'text');
            }
            if (u.includes('/search/suggestions')) {
              return response('<a href="/anime/saga-of-tanya-the-evil-4517"><img alt="Saga of Tanya the Evil"></a>', 'text');
            }
            if (u.includes('/api/frontend/anime/6383/episodes')) {
              return response({ episodes: [{ id: 's2e1', number: 1 }] });
            }
            if (u.includes('/api/frontend/anime/4517/episodes')) {
              throw new Error('BUG: S2 fell back to AniDB season-1 record 4517');
            }
            if (u.includes('/api/frontend/episode/s2e1/languages')) {
              return response([
                { code: 'eng', embed_url: 'https://embed.test/eng' },
                { code: 'jpn', embed_url: 'https://embed.test/jpn' }
              ]);
            }
            if (u === 'https://embed.test/eng') return response("file: 'https://cdn.test/dub.m3u8'", 'text');
            if (u === 'https://embed.test/jpn') return response("file: 'https://cdn.test/sub.m3u8'", 'text');
            throw new Error('Unhandled mock URL: ' + u);
          };

          const provider = require('./providers/anidb.js');
          (async () => {
            const streams = await provider.getStreams('69346', 'tv', 2, 1);
            if (streams.length !== 2) throw new Error('expected two streams, got ' + streams.length);
            if (!streams.some(x => x.name.includes('[DUB]'))) throw new Error('missing DUB');
            if (!streams.some(x => x.name.includes('[HARDSUB]'))) throw new Error('missing HARDSUB');
            if (!requests.some(x => x.includes('/api/frontend/anime/6383/episodes'))) throw new Error('did not select 6383');
            if (requests.some(x => x.includes('/api/frontend/anime/4517/episodes'))) throw new Error('selected 4517');
            console.log('PASS: stale MAL mapping still resolves Tanya S2E1 to AniDB 6383');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Validate repository and commit
        shell: bash
        run: |
          set -euo pipefail
          for f in providers/*.js; do node --check "$f" >/dev/null; done
          node -e "const m=require('./manifest.json'); if(m.version!=='0.1.16') process.exit(1); const a=m.scrapers.find(x=>x.id==='anidb'); if(!a||a.version!=='1.0.3') process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers/anidb.js manifest.json sources-lock.json
          git commit -m "Fix AniDB later-season identity fallback [skip ci]"
          git push origin HEAD:Limitless-Nuviotest
