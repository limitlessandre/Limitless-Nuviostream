name: Probe HentaiHaven catalog endpoints

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-catalog
    paths:
      - '.github/workflows/probe-hentaihaven-catalog.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe bulk catalog endpoints
        run: |
          set -u
          probe() {
            name="$1"
            url="$2"
            body="/tmp/${name}.body"
            headers="/tmp/${name}.headers"
            status="$(curl --silent --show-error --location --max-time 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            echo "===== ${name} ====="
            echo "URL: ${url}"
            echo "STATUS: ${status}"
            grep -Ei '^(content-type|x-wp-total|x-wp-totalpages|link|location):' "$headers" || true
            echo '--- body preview ---'
            head -c 1800 "$body" 2>/dev/null || true
            echo
            echo
          }

          probe wp_manga 'https://hentaihaven.vip/wp-json/wp/v2/wp-manga?per_page=2&page=1'
          probe genre_terms 'https://hentaihaven.vip/wp-json/wp/v2/wp-manga-genre?per_page=5&page=1'
          probe tag_terms 'https://hentaihaven.vip/wp-json/wp/v2/wp-manga-tag?per_page=5&page=1'
          probe author_terms 'https://hentaihaven.vip/wp-json/wp/v2/wp-manga-author?per_page=5&page=1'
          probe release_terms 'https://hentaihaven.vip/wp-json/wp/v2/wp-manga-release?per_page=5&page=1'
          probe sitemap_index 'https://hentaihaven.vip/sitemap_index.xml'
          probe manga_sitemap 'https://hentaihaven.vip/wp-manga-sitemap.xml'
          probe manga_sitemap2 'https://hentaihaven.vip/wp-manga-sitemap2.xml'
          probe chapter_sitemap1 'https://hentaihaven.vip/wp-manga-chapters-sitemap1.xml'
          probe chapter_sitemap2 'https://hentaihaven.vip/wp-manga-chapters-sitemap2.xml'
