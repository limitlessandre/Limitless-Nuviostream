name: Probe HentaiHaven catalog endpoints

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-catalog
    paths:
      - '.github/workflows/probe-hentaihaven-catalog.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe bulk catalog endpoints
        run: |
          set -u
          probe() {
            name="$1"
            url="$2"
            body="/tmp/${name}.body"
            headers="/tmp/${name}.headers"
            status="$(curl --silent --show-error --location --max-time 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            echo "===== ${name} ====="
            echo "URL: ${url}"
            echo "STATUS: ${status}"
            grep -Ei '^(content-type|x-wp-total|x-wp-totalpages|link|location):' "$headers" || true
            echo '--- body preview ---'
            head -c 1400 "$body" 2>/dev/null || true
            echo
            echo
          }

          probe wp_types 'https://hentaihaven.vip/wp-json/wp/v2/types'
          probe wp_manga 'https://hentaihaven.vip/wp-json/wp/v2/wp-manga?per_page=2&page=1'
          probe wp_search 'https://hentaihaven.vip/wp-json/wp/v2/search?per_page=2&page=1&subtype=wp-manga'
          probe sitemap_index 'https://hentaihaven.vip/wp-sitemap.xml'
          probe sitemap_manga 'https://hentaihaven.vip/wp-sitemap-posts-wp-manga-1.xml'
          probe search_archive 'https://hentaihaven.vip/?s=&post_type=wp-manga'
          probe search_page2 'https://hentaihaven.vip/page/2/?s=&post_type=wp-manga'
