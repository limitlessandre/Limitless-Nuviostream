name: Deploy season-aware Praxiel AniDB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-anidb-praxiel.yml

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest
          fetch-depth: 0

      - name: Install Praxiel-based AniDB candidate
        id: install
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:.anidb-praxiel-v1.0.2.js > /tmp/anidb.js
          {
            echo '// SPDX-License-Identifier: GPL-3.0-only'
            cat /tmp/anidb.js
          } > providers/anidb.js
          node --check providers/anidb.js

      - name: Update Limitless bookkeeping
        id: book
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.1.15'
          ani = next(x for x in manifest['scrapers'] if x.get('id') == 'anidb')
          ani.update({
              'name': 'AniDB',
              'description': 'Limitless-maintained AniDB based on Eclipsia Praxiel runtime access, with MAL season identity locking, finite exact aliases, and standardized DUB/HARDSUB labels.',
              'version': '1.0.2',
              'author': 'Limitless maintained port based on Eclipsia Praxiel (GPL-3.0)',
              'enabled': True,
              'hasSettings': False,
              'formats': ['m3u8'],
              'contentLanguage': ['en', 'ja']
          })
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          lock_path = Path('sources-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['baseline'] = 'anime-v0.1.15'
          lock['frozenOn'] = '2026-08-24'
          entry = next(x for x in lock['providers'] if x.get('filename') == 'anidb.js')
          entry['repository'] = 'limitlessandre/Limitless-Nuviostream'
          entry['commit'] = 'Limitless-Nuviotest'
          entry['path'] = 'providers/anidb.js'
          entry['maintainedLocally'] = True
          entry['localVersion'] = '1.0.2'
          entry['license'] = 'GPL-3.0-only'
          entry['referenceImplementations'] = [{
              'repository': 'gitea.com/eclipsia/nuvio-plugin',
              'commit': 'b774c55',
              'path': 'providers/praxiel.js',
              'name': 'Praxiel 1.1.0',
              'license': 'GPL-3.0'
          }]
          entry['notes'] = ('Rebuilt from Eclipsia Praxiel 1.1.0 runtime access/extraction behavior. '
                            'Limitless adds TMDB-to-MAL season mapping, season-specific finite aliases, '
                            'MAL-verified generic fallback to prevent later seasons from falling into season 1, '
                            'an animation-only guard, and standardized English [DUB] / Japanese [HARDSUB] labels. '
                            'Praxiel itself was confirmed working in Nuvio Desktop but mapped Tanya S2E1 to S1E1; '
                            'this rebuild specifically fixes that identity bug.')
          lock_path.write_text(json.dumps(lock, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Mock Tanya season identity gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const calls = [];

          function reply(body, kind = 'json', status = 200) {
            return {
              ok: status >= 200 && status < 300,
              status,
              async json() { return typeof body === 'string' ? JSON.parse(body) : body; },
              async text() { return typeof body === 'string' ? body : JSON.stringify(body); }
            };
          }

          global.fetch = async function(url, options = {}) {
            url = String(url);
            calls.push({ url, options });

            if (url.includes('api.themoviedb.org/3/tv/69346')) {
              return reply({
                name: 'Saga of Tanya the Evil',
                original_name: '幼女戦記',
                external_ids: { imdb_id: 'tt6163128' },
                genres: [{ id: 16 }],
                alternative_titles: { results: [] }
              });
            }

            if (url.includes('id-mapping-api-malid.hf.space/api/resolve')) {
              return reply({ mal_id: 999002, mal_episode: 1, anime_title: 'Saga of Tanya the Evil II' });
            }

            if (url.includes('api.jikan.moe/v4/anime/999002')) {
              return reply({ data: {
                title: 'Youjo Senki II',
                title_english: 'Saga of Tanya the Evil II',
                title_japanese: '幼女戦記 II',
                title_synonyms: [],
                titles: [{ title: 'Saga of Tanya the Evil II' }]
              }});
            }

            if (url === 'https://graphql.anilist.co') {
              return reply({ data: { Media: {
                title: { english: 'Saga of Tanya the Evil II', romaji: 'Youjo Senki II', native: '幼女戦記 II' },
                synonyms: []
              }}});
            }

            if (url.includes('/search/suggestions?q=')) {
              return reply('<a href="/anime/saga-of-tanya-the-evil-ii-6383"><img alt="Saga of Tanya the Evil II"></a>', 'text');
            }

            if (url.includes('/api/frontend/anime/6383/episodes')) {
              return reply({ episodes: [{ id: 638301, number: 1, title: 'Salamander Combat Team' }] });
            }

            if (url.includes('/api/frontend/anime/4517/episodes')) {
              throw new Error('SEASON BUG: provider requested Tanya season 1 record 4517 for S2E1');
            }

            if (url.includes('/api/frontend/episode/638301/languages')) {
              return reply({ languages: [
                { code: 'eng', embed_url: 'https://embed.example/tanya-s2e1-dub' },
                { code: 'jpn', embed_url: 'https://embed.example/tanya-s2e1-jpn' }
              ]});
            }

            if (url === 'https://embed.example/tanya-s2e1-dub') {
              return reply("file: 'https://cdn.example/tanya-s2e1-dub.m3u8'", 'text');
            }

            if (url === 'https://embed.example/tanya-s2e1-jpn') {
              return reply("file: 'https://cdn.example/tanya-s2e1-jpn.m3u8'", 'text');
            }

            return reply({}, 'json', 404);
          };

          const provider = require('./providers/anidb.js');
          (async () => {
            const streams = await provider.getStreams('69346', 'tv', 2, 1);
            console.log(JSON.stringify(streams, null, 2));

            if (streams.length !== 2) throw new Error(`Expected 2 streams, got ${streams.length}`);
            if (!streams.some(x => /\[DUB\]/.test(x.name))) throw new Error('DUB label missing');
            if (!streams.some(x => /\[HARDSUB\]/.test(x.name))) throw new Error('HARDSUB label missing');
            if (!streams.every(x => String(x.title).includes('S2E1'))) throw new Error('Requested season identity missing from returned streams');

            const urls = calls.map(x => x.url);
            if (!urls.some(x => x.includes('/api/frontend/anime/6383/episodes'))) {
              throw new Error('Tanya S2 AniDB record 6383 was never requested');
            }
            if (urls.some(x => x.includes('/api/frontend/anime/4517/episodes'))) {
              throw new Error('Tanya S1 record 4517 was requested for S2E1');
            }

            console.log('PASS: Tanya S2E1 locked to AniDB.app record 6383 with DUB + HARDSUB.');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Clean old AniDB experiments and validate repository
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/*anidb*.yml
          rm -f .anidb-*.txt anidb-*.log

          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          lock = json.loads(Path('sources-lock.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '0.1.15'
          assert lock['baseline'] == 'anime-v0.1.15'
          assert len(manifest['scrapers']) == 17
          ani = next(x for x in manifest['scrapers'] if x['id'] == 'anidb')
          assert ani['version'] == '1.0.2'
          assert ani['enabled'] is True
          assert ani['hasSettings'] is False
          assert ani['formats'] == ['m3u8']
          PY

          for file in providers/*.js; do
            node --check "$file" >/dev/null
          done
          echo 'All provider syntax checks passed.'

      - name: Commit AniDB replacement to test branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Replace AniDB with season-aware Praxiel baseline [skip ci]"
          git push origin HEAD:Limitless-Nuviotest

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL: ${{ steps.install.outcome }}
          BOOK: ${{ steps.book.outcome }}
          GATE: ${{ steps.gate.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
        shell: bash
        run: |
          gh issue comment 2 --repo "${{ github.repository }}" --body "Praxiel AniDB deployment: install=${INSTALL:-skipped}, bookkeeping=${BOOK:-skipped}, Tanya-S2-gate=${GATE:-skipped}, validation=${VALIDATE:-skipped}, commit=${COMMIT:-skipped}."
