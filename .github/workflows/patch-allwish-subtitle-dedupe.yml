name: Patch All-Wish subtitle language dedupe

on:
  push:
    branches: [Limitless-Nuviotest]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch All-Wish subtitle dedupe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          provider = Path('providers/allwish.js')
          text = provider.read_text(encoding='utf-8')

          new_subs = r'''function subs(tracks, headers, assumeEnglish) {
            const bestByLanguage = new Map();

            for (const t of Array.isArray(tracks) ? tracks : []) {
              if (!t) continue;

              const kind = String(t.kind || "captions").toLowerCase();
              if (t.kind && kind !== "captions" && kind !== "subtitles") continue;

              const u = t.file || t.url || t.src;
              if (!u) continue;

              const rawLabel = String(t.label || t.name || t.language || t.lang || "").trim();
              let l = lang(rawLabel, u);

              if (!l && assumeEnglish && /\.(?:vtt|srt|ass|ssa)(?:$|[?#])/i.test(u)) {
                l = ["en", "English"];
              }
              if (!l) continue;

              const label = rawLabel.toLowerCase();
              let score = 0;

              if (t.default === true || String(t.default).toLowerCase() === "true") score += 100;
              if (kind === "captions" || kind === "subtitles") score += 20;
              if (/\.vtt(?:$|[?#])/i.test(u)) score += 10;
              if (label === l[1].toLowerCase() || label === l[0]) score += 30;
              if (/\b(?:sdh|hearing|forced|signs?|songs?|commentary)\b/i.test(label)) score -= 50;

              const current = bestByLanguage.get(l[0]);
              if (!current || score > current.score) {
                bestByLanguage.set(l[0], {
                  score,
                  subtitle: {
                    url: u,
                    language: l[0],
                    lang: l[0],
                    name: `${l[1]} [All-Wish Soft Subtitle]`,
                    headers
                  }
                });
              }
            }

            return Array.from(bestByLanguage.values()).map(x => x.subtitle);
          }'''

          pattern = r'function subs\(tracks, headers, assumeEnglish\) \{.*?\n\}\n\nfunction stream'
          replaced, count = re.subn(pattern, new_subs + '\n\nfunction stream', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected to replace one subs() function, replaced {count}')
          provider.write_text(replaced, encoding='utf-8')

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.1.3'
          for scraper in manifest.get('scrapers', []):
              if scraper.get('id') == 'allwish':
                  scraper['version'] = '1.2.1'
                  scraper['description'] = 'Limitless-maintained All-Wish anime provider with season-aware MAL episode mapping, MAL/AniList/Kitsu/TMDB title aliases, and one preferred soft-subtitle track per language.'
                  break
          else:
              raise SystemExit('All-Wish scraper entry not found')
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          Path('.github/workflows/patch-allwish-subtitle-dedupe.yml').unlink()
          PY

          node --check providers/allwish.js
          python -m json.tool manifest.json >/dev/null

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Limitless Baseline Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers/allwish.js manifest.json .github/workflows/patch-allwish-subtitle-dedupe.yml
          git commit -m "Fix All-Wish duplicate subtitle languages"
          git push
