name: Probe AniDB index endpoints

on:
  push:
    branches: [Limitless-Nuviotest]
    paths:
      - .github/workflows/probe-anidb-index.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe index-style endpoints
        shell: bash
        run: |
          node <<'NODE' > .anidb-index-probe.txt 2>&1
          const urls = [
            'https://anidb.app/robots.txt',
            'https://anidb.app/sitemap.xml',
            'https://anidb.app/sitemap_index.xml',
            'https://anidb.app/sitemap-index.xml',
            'https://anidb.app/api/frontend/anime',
            'https://anidb.app/api/frontend/anime?search=Frieren',
            'https://anidb.app/api/frontend/search?q=Frieren',
            'https://anidb.app/api/frontend/anime/search?q=Frieren',
            'https://anidb.app/api/search?q=Frieren',
            'https://anidb.app/api/frontend/browse?q=Frieren',
            'https://anidb.app/api/frontend/animes?q=Frieren'
          ];
          const headers = {
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
            'Accept':'*/*',
            'Referer':'https://anidb.app/'
          };
          (async()=>{
            for (const url of urls) {
              try {
                const r = await fetch(url,{headers,redirect:'manual'});
                const t = await r.text();
                console.log(`URL ${url}\nSTATUS ${r.status} CT ${r.headers.get('content-type')} LOC ${r.headers.get('location')||''} LEN ${t.length}\n${t.slice(0,1800).replace(/\s+/g,' ')}\n---`);
              } catch(e) { console.log(`URL ${url}\nERR ${e.message}\n---`); }
            }
          })();
          NODE
      - name: Commit report and self-remove
        shell: bash
        run: |
          rm -f .github/workflows/probe-anidb-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .anidb-index-probe.txt .github/workflows/probe-anidb-index.yml
          git commit -m "Probe AniDB index endpoints [skip ci]"
          git push origin HEAD:Limitless-Nuviotest
