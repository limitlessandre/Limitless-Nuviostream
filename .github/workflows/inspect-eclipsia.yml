name: Inspect Eclipsia Praxiel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-eclipsia.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Clone Eclipsia and capture Praxiel/AniDB source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/eclipsia
          git clone --depth 1 https://gitea.com/eclipsia/nuvio-plugin.git /tmp/eclipsia

          cp /tmp/eclipsia/providers/praxiel.js .praxiel-source.js
          cp /tmp/eclipsia/stable/manifest.json .eclipsia-stable-manifest.json

          {
            echo '=== ECLIPSIA HEAD ==='
            git -C /tmp/eclipsia log -1 --oneline
            echo
            echo '=== PRAXIEL MANIFEST ENTRY ==='
            python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/eclipsia/stable/manifest.json').read_text())
          for s in m.get('scrapers',[]):
              if s.get('id')=='praxiel':
                  print(json.dumps(s,indent=2))
          PY
            echo
            echo '=== PRAXIEL SOURCE ==='
            cat /tmp/eclipsia/providers/praxiel.js
          } > .eclipsia-inspection.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .eclipsia-inspection.txt .praxiel-source.js .eclipsia-stable-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Capture Praxiel AniDB source [skip ci]"
            git push origin HEAD:main
          fi
