name: Probe AniDB live behavior

on:
  push:
    branches: [Limitless-Nuviotest]
    paths:
      - .github/workflows/probe-anidb.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe current provider and modern AniDB API
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install cheerio-without-node-native >/dev/null 2>&1

          node <<'NODE' > .anidb-probe.txt 2>&1
          const realFetch = global.fetch;
          global.fetch = async function(url, options) {
            const u = String(url);
            try {
              const r = await realFetch(url, options);
              console.log(`FETCH ${r.status} ${u}`);
              return r;
            } catch (e) {
              console.log(`FETCH ERR ${u} :: ${e.message}`);
              throw e;
            }
          };

          async function direct(url) {
            try {
              const r = await realFetch(url, {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                  'Referer': 'https://anidb.app/',
                  'Accept': 'application/json, text/plain, */*'
                }
              });
              const body = await r.text();
              console.log(`DIRECT ${r.status} ${url}`);
              console.log(body.slice(0, 2500));
              return { status: r.status, body };
            } catch (e) {
              console.log(`DIRECT ERR ${url} :: ${e.message}`);
              return null;
            }
          }

          (async () => {
            console.log('=== MODERN API: Frieren 1663 ===');
            const frieren = await direct('https://anidb.app/api/frontend/anime/1663/episodes');
            let epId = null;
            if (frieren && frieren.status === 200) {
              try {
                const j = JSON.parse(frieren.body);
                epId = j?.episodes?.[0]?.id || null;
              } catch (_) {}
            }
            if (epId) {
              console.log(`=== LANGUAGES: episode ${epId} ===`);
              await direct(`https://anidb.app/api/frontend/episode/${epId}/languages`);
            }

            console.log('=== MODERN API: Tanya 4517 ===');
            await direct('https://anidb.app/api/frontend/anime/4517/episodes');

            console.log('=== OLD CANDIDATE ENDPOINTS: Frieren ===');
            await direct('https://anidb.app/api/anime/1663/episodes');
            await direct('https://anidb.app/ajax/anime/1663/episodes');
            await direct('https://anidb.app/anime/1663/episodes');

            console.log('=== CURRENT LIMITLESS PROVIDER: Frieren TMDB 209867 S1E1 ===');
            try {
              const provider = require('./providers/anidb.js');
              const out = await provider.getStreams('209867', 'tv', 1, 1);
              console.log(`RESULT_COUNT ${Array.isArray(out) ? out.length : -1}`);
              console.log(JSON.stringify(out, null, 2).slice(0, 12000));
            } catch (e) {
              console.log(`PROVIDER ERR ${e.stack || e.message}`);
            }

            console.log('=== CURRENT LIMITLESS PROVIDER: Tanya TMDB 69346 S1E1 ===');
            try {
              const provider = require('./providers/anidb.js');
              const out = await provider.getStreams('69346', 'tv', 1, 1);
              console.log(`RESULT_COUNT ${Array.isArray(out) ? out.length : -1}`);
              console.log(JSON.stringify(out, null, 2).slice(0, 12000));
            } catch (e) {
              console.log(`PROVIDER ERR ${e.stack || e.message}`);
            }
          })();
          NODE

      - name: Commit probe report and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-anidb.yml
          rm -rf node_modules package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .anidb-probe.txt .github/workflows/probe-anidb.yml
          git commit -m "Probe AniDB live endpoints [skip ci]"
          git push origin HEAD:Limitless-Nuviotest
