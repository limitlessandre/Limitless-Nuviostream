name: Deploy Scarlet Peach Hanime Worker

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-providers
    paths:
      - 'workers/scarlet-peach-hanime/**'
      - '.github/workflows/deploy-scarlet-peach-hanime.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/scarlet-peach-hanime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Worker
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Worker health
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            body="$(curl --fail --silent --show-error --max-time 15 https://scarlet-peach-hanime.limitlessandre.workers.dev/health || true)"
            if printf '%s' "$body" | grep -q 'Scarlet Peach Hanime Resolver'; then
              printf '%s\n' "$body"
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo 'Worker health check failed' >&2
              exit 1
            fi
            sleep 3
          done

      - name: Verify normalized catalog feed
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 https://scarlet-peach-hanime.limitlessandre.workers.dev/catalog.json -o /tmp/hanime-catalog.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/hanime-catalog.json', 'utf8'));
          if (data.provider !== 'hanime' || !Array.isArray(data.records) || data.records.length < 100) {
            throw new Error(`Invalid Hanime catalog feed: provider=${data.provider} count=${data.records?.length || 0}`);
          }
          const first = data.records[0] || {};
          console.log(JSON.stringify({ count: data.records.length, first: { title: first.title, slug: first.slug }, fields: Object.keys(first).sort() }));
          NODE

      - name: Probe live resolve paths
        run: |
          set -euo pipefail
          probe() {
            name="$1"
            payload="$2"
            body_file="/tmp/${name}.json"
            status="$(curl --silent --show-error --max-time 30 \
              -o "$body_file" -w '%{http_code}' \
              -X POST https://scarlet-peach-hanime.limitlessandre.workers.dev/resolve \
              -H 'content-type: application/json' \
              --data "$payload" || true)"
            echo "${name} status=${status}"
            cat "$body_file" 2>/dev/null || true
            echo
            test "$status" = "200"
          }

          probe bible-black-fuzzy '{"title":"Bible Black 1","aliases":["Bible Black"],"year":2001,"episode":1}'
          probe jimihen-fuzzy '{"title":"Jimihen!! Jimiko o Kae Chau Jun Isei Kouyuu Season 1","aliases":["Jimihen!!: Jimiko wo Kaechau Jun Isei Kouyuu!!"],"year":2021,"episode":1}'
          probe bible-black-2-exact '{"title":"Bible Black 2","episode":2,"slug":"bible-black-2"}'
          probe jimihen-exact '{"title":"Jimihen!! Jimiko o Kae Chau Jun Isei Kouyuu Season 1","episode":1,"slug":"jimihen-jimiko-o-kae-chau-jun-isei-kouyuu-season-1"}'
