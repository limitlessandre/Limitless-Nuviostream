name: Probe AniDB browse headers

on:
  push:
    branches: [Limitless-Nuviotest]
    paths:
      - .github/workflows/probe-anidb-headers.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Limitless-Nuviotest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe headers
        shell: bash
        run: |
          node <<'NODE' > .anidb-header-probe.txt 2>&1
          const url = 'https://anidb.app/browse?q=Saga%20of%20Tanya%20the%20Evil';
          const cases = [
            ['UA only', {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'}],
            ['+ Referer', {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36','Referer':'https://anidb.app/'}],
            ['+ Referer + Origin', {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36','Referer':'https://anidb.app/','Origin':'https://anidb.app'}],
            ['Full', {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36','Accept':'*/*','Accept-Language':'en-US,en;q=0.9','Referer':'https://anidb.app/','Origin':'https://anidb.app'}]
          ];
          (async()=>{
            for (const [name, headers] of cases) {
              try {
                const r = await fetch(url,{headers});
                const t = await r.text();
                console.log(`${name}: ${r.status} len=${t.length} hasTanya=${/saga-of-tanya-the-evil-4517/i.test(t)} hasAnime=${/\/anime\//i.test(t)}`);
                console.log(t.slice(0,500).replace(/\s+/g,' '));
              } catch(e) { console.log(`${name}: ERR ${e.message}`); }
            }
            for (const path of [
              'https://anidb.app/search/suggestions?q=Saga%20of%20Tanya%20the%20Evil',
              'https://anidb.app/browse?q=Frieren'
            ]) {
              try {
                const r = await fetch(path,{headers:cases[3][1]});
                const t = await r.text();
                console.log(`FULL ${path}: ${r.status} len=${t.length} hasAnime=${/\/anime\//i.test(t)}`);
                console.log(t.slice(0,1000).replace(/\s+/g,' '));
              } catch(e) { console.log(`ERR ${path}: ${e.message}`); }
            }
          })();
          NODE
      - name: Commit report and self-remove
        shell: bash
        run: |
          rm -f .github/workflows/probe-anidb-headers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .anidb-header-probe.txt .github/workflows/probe-anidb-headers.yml
          git commit -m "Probe AniDB browse headers [skip ci]"
          git push origin HEAD:Limitless-Nuviotest
