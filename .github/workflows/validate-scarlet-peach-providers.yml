name: Validate Scarlet Peach Providers

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-providers
    paths:
      - 'providers/**'
      - 'workers/scarlet-peach-identity/**'
      - 'manifest.json'
      - '.github/workflows/validate-scarlet-peach-providers.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check provider JavaScript syntax
        run: |
          set -euo pipefail
          for file in providers/*.js; do
            node --check "$file"
          done

      - name: Validate provider manifest
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (!manifest.name || !manifest.version || !Array.isArray(manifest.scrapers) || !manifest.scrapers.length) {
            throw new Error('Invalid provider manifest shape');
          }
          for (const scraper of manifest.scrapers) {
            if (!scraper.id || !scraper.name || !scraper.filename || !scraper.version) throw new Error(`Invalid scraper entry ${scraper.id || '<missing id>'}`);
          }
          const hh = manifest.scrapers.filter(s => s.name === 'HentaiHaven');
          if (hh.length !== 2) throw new Error(`Expected two platform-filtered HentaiHaven entries, got ${hh.length}`);
          const windows = hh.find(s => s.id === 'scarlet-peach-hentaihaven-windows');
          const other = hh.find(s => s.id === 'scarlet-peach-hentaihaven');
          if (!windows || !Array.isArray(windows.supportedPlatforms) || !windows.supportedPlatforms.includes('windows')) throw new Error('Windows HentaiHaven manifest filter missing');
          if (!other || !Array.isArray(other.disabledPlatforms) || !other.disabledPlatforms.includes('windows')) throw new Error('Non-Windows HentaiHaven manifest filter missing');
          console.log(`Validated ${manifest.scrapers.length} scraper definitions, manifest ${manifest.version}`);
          NODE

      - name: Verify TMDB numeric ID reaches stable provider matching
        run: |
          node - <<'NODE'
          const checks = [
            ['Hanime', require('./providers/scarlet-peach-hanime-v9.js')],
            ['HentaiHaven', require('./providers/scarlet-peach-hentaihaven-v4.js')]
          ];
          (async () => {
            for (const [name, provider] of checks) {
              const rows = await provider.getStreams('80219', 'tv', 1, 1);
              if (!Array.isArray(rows) || !rows.length) throw new Error(`${name} returned no rows`);
              const first = String(rows[0].name || rows[0].title || '');
              console.log(`${name}: ${first}`);
              if (/DIAG\s+(ID|MATCH)/i.test(first)) throw new Error(`${name} did not clear identity/title matching for TMDB 80219`);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Verify HentaiHaven metadata and Windows H.264 compatibility
        run: |
          node - <<'NODE'
          const provider = require('./providers/scarlet-peach-hentaihaven-v4.js');
          (async () => {
            globalThis.SCRAPER_ID = 'test:scarlet-peach-hentaihaven';
            const normalRows = await provider.getStreams('sp:hanime:deco-x-deco-the-animation', 'tv', 1, 1);
            if (!Array.isArray(normalRows) || !normalRows.length) throw new Error('HentaiHaven normal Deco returned no rows');
            const normalNames = normalRows.map(row => String(row.name || ''));
            const normalQualities = normalRows.map(row => String(row.quality || ''));
            console.log('normal:', normalNames.join(' | '));
            for (const expected of ['1080p', '720p', '360p']) {
              if (!normalQualities.includes(expected)) throw new Error(`HentaiHaven normal mode missing ${expected}: ${normalQualities.join(',')}`);
            }
            if (!normalNames.every(name => /\[SUB\]/i.test(name))) throw new Error('HentaiHaven Deco should be labeled [SUB]');
            if (!normalNames.every(name => /Censored/i.test(name))) throw new Error('HentaiHaven Deco censorship label missing');

            globalThis.SCRAPER_ID = 'test:scarlet-peach-hentaihaven-windows';
            const windowsRows = await provider.getStreams('sp:hanime:deco-x-deco-the-animation', 'tv', 1, 1);
            if (!Array.isArray(windowsRows) || !windowsRows.length) throw new Error('HentaiHaven Windows Deco returned no rows');
            const windowsNames = windowsRows.map(row => String(row.name || ''));
            const windowsQualities = windowsRows.map(row => String(row.quality || ''));
            console.log('windows:', windowsNames.join(' | '));
            if (windowsQualities.includes('1080p')) throw new Error(`Windows mode leaked VP9 1080p: ${windowsQualities.join(',')}`);
            for (const expected of ['720p', '360p']) {
              if (!windowsQualities.includes(expected)) throw new Error(`HentaiHaven Windows mode missing ${expected}: ${windowsQualities.join(',')}`);
            }
            if (windowsRows.some(row => /playlist_vp9/i.test(decodeURIComponent(String(row.url || ''))))) {
              throw new Error('Windows mode leaked a VP9 playlist');
            }
            if (!windowsNames.every(name => /\[SUB\]/i.test(name))) throw new Error('HentaiHaven Windows Deco should be labeled [SUB]');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Verify HStream Scarlet Peach identity, DASH qualities and subtitles
        run: |
          node - <<'NODE'
          const provider = require('./providers/scarlet-peach-hstream-v2.js');
          (async () => {
            const rows = await provider.getStreams('sp:hanime:deco-x-deco-the-animation', 'tv', 1, 1);
            if (!Array.isArray(rows) || !rows.length) throw new Error('HStream Deco x Deco returned no rows');
            const names = rows.map(row => String(row.name || ''));
            console.log(names.join('\n'));
            if (names.some(name => /DIAG/i.test(name))) throw new Error('HStream Deco x Deco returned a diagnostic');
            const qualities = rows.map(row => String(row.quality || ''));
            for (const expected of ['2160p', '1080p', '720p']) {
              if (!qualities.includes(expected)) throw new Error(`HStream missing ${expected}: ${qualities.join(',')}`);
            }
            if (!names.some(name => /4K\s*2160p/i.test(name))) throw new Error('HStream 2160p row is missing Nexus 4K label');
            if (!names.every(name => /\[SUB\]/i.test(name))) throw new Error('HStream English subtitle evidence was not reflected as [SUB]');
            if (!names.every(name => /Censored/i.test(name))) throw new Error('HStream provider censorship was not reflected in labels');
            if (!rows.every(row => String(row.type || '').toLowerCase() === 'mpd')) throw new Error('HStream rows are not native MPD/DASH');
            for (const row of rows) {
              if (!Array.isArray(row.subtitles) || !row.subtitles.length) throw new Error(`HStream ${row.quality} is missing selectable subtitles`);
              const english = row.subtitles.find(sub => String(sub.language || sub.lang || '').toLowerCase() === 'en');
              if (!english) throw new Error(`HStream ${row.quality} is missing English subtitle object`);
              if (!/\.ass(?:$|\?)/i.test(String(english.url || ''))) throw new Error(`HStream ${row.quality} English subtitle is not ASS: ${english.url}`);
              if (!english.headers || !english.headers.Referer) throw new Error(`HStream ${row.quality} subtitle headers missing`);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
