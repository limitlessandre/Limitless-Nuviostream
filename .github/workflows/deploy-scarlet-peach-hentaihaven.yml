name: Deploy Scarlet Peach HentaiHaven Worker

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-providers
    paths:
      - 'workers/scarlet-peach-hentaihaven/**'
      - '.github/workflows/deploy-scarlet-peach-hentaihaven.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/scarlet-peach-hentaihaven
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Worker syntax
        run: |
          node --check src/router.js
          node --check src/router-v2.js

      - name: Deploy Worker
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Worker health and version
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            body="$(curl --fail --silent --show-error --max-time 15 https://scarlet-peach-hentaihaven.limitlessandre.workers.dev/health || true)"
            if printf '%s' "$body" | grep -q 'Scarlet Peach HentaiHaven Resolver' && \
               printf '%s' "$body" | grep -q '"version":"0.5.2"' && \
               printf '%s' "$body" | grep -q 'hentaihaven.vip' && \
               printf '%s' "$body" | grep -q '"nativeTrackPreservation":true' && \
               printf '%s' "$body" | grep -q '"androidSubtitleTransport":"external-sidecar"' && \
               printf '%s' "$body" | grep -q '"verifiedDubLabels":true'; then
              printf '%s\n' "$body"
              break
            fi
            echo "Waiting for v0.5.2 propagation (attempt ${attempt})"
            if [ "$attempt" = 8 ]; then
              echo 'Worker health/version check failed' >&2
              printf '%s\n' "$body" >&2
              exit 1
            fi
            sleep 3
          done

      - name: Probe desktop and Android HentaiHaven HLS tracks
        run: |
          set -euo pipefail
          probe() {
            name="$1"
            payload="$2"
            expected_backend="$3"
            min_height="${4:-0}"
            expected_censor="${5:-}"
            body_file="/tmp/${name}.json"
            status="$(curl --silent --show-error --max-time 60 \
              -o "$body_file" -w '%{http_code}' \
              -X POST https://scarlet-peach-hentaihaven.limitlessandre.workers.dev/resolve \
              -H 'content-type: application/json' \
              --data "$payload" || true)"
            echo "${name} status=${status}"
            cat "$body_file" 2>/dev/null || true
            echo
            test "$status" = "200"
            NAME="$name" EXPECTED_BACKEND="$expected_backend" MIN_HEIGHT="$min_height" EXPECTED_CENSOR="$expected_censor" BODY_FILE="$body_file" node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.env.BODY_FILE, 'utf8'));
          if (!Array.isArray(data.streams) || !data.streams.length) throw new Error(`${process.env.NAME} returned no streams`);
          if (!data.nativeTrackPreservation) throw new Error(`${process.env.NAME} native track preservation missing`);
          if (!data.verifiedDubLabels) throw new Error(`${process.env.NAME} verified dub label guard missing`);
          if (process.env.EXPECTED_BACKEND && data.backend !== process.env.EXPECTED_BACKEND) {
            throw new Error(`${process.env.NAME} expected backend=${process.env.EXPECTED_BACKEND}, got ${data.backend}`);
          }
          const heights = data.streams.map(s => Number(s.height || 0)).filter(Boolean);
          const maxHeight = Math.max(...heights);
          const minHeight = Number(process.env.MIN_HEIGHT || 0);
          if (maxHeight < minHeight) throw new Error(`${process.env.NAME} expected >=${minHeight}p, got ${maxHeight}p`);
          if (new Set(heights).size !== heights.length) throw new Error(`${process.env.NAME} returned duplicate quality rows: ${heights.join(',')}`);
          if (!data.streams.every(s => /scarlet-peach-hentaihaven\.limitlessandre\.workers\.dev\/play\.m3u8/i.test(s.url || ''))) throw new Error(`${process.env.NAME} did not route qualities through native-track master`);
          if (!data.metadata || typeof data.metadata !== 'object') throw new Error(`${process.env.NAME} missing metadata object`);
          if (!Array.isArray(data.metadata.subtitleTracks) || !data.metadata.subtitleTracks.some(s => String(s.language || '').toLowerCase() === 'en')) throw new Error(`${process.env.NAME} English subtitle track missing`);
          if (process.env.EXPECTED_CENSOR && data.metadata.censorStatus !== process.env.EXPECTED_CENSOR) {
            throw new Error(`${process.env.NAME} expected censor=${process.env.EXPECTED_CENSOR}, got ${data.metadata.censorStatus}`);
          }
          console.log(`${process.env.NAME} backend=${data.backend} qualities=${heights.join('/')} censor=${data.metadata.censorStatus} audio=${(data.metadata.audioLanguages||[]).join(',')} transportAudio=${(data.metadata.transportAudioLanguages||[]).join(',')} subs=${(data.metadata.subtitleLanguages||[]).join(',')} variant=${data.metadata.audioVariant||'unknown'} evidence=${data.metadata.audioEvidence||'unknown'}`);
          NODE
          }

          probe com-known '{"title":"Soshite Watashi wa Sensei ni","episode":1}' com 1080
          probe vip-jimihen '{"title":"Jimihen!!: Jimiko wo Kaechau Jun Isei Kouyuu!!","aliases":["Jimihen!! Jimiko o Kae Chau Jun Isei Kouyuu"],"episode":1}' vip 1080 censored

          curl -sS --max-time 90 -X POST \
            https://scarlet-peach-hentaihaven.limitlessandre.workers.dev/resolve \
            -H 'content-type: application/json' \
            --data '{"title":"Deco x Deco The Animation","episode":1}' > /tmp/deco.json

          BODY_FILE=/tmp/deco.json node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.BODY_FILE,'utf8'));
          if (!d.metadata) throw new Error('Deco metadata missing');
          if (d.metadata.audioVariant !== 'sub') throw new Error(`Deco should be sub-only, got ${d.metadata.audioVariant}`);
          if (!Array.isArray(d.metadata.audioLanguages) || !d.metadata.audioLanguages.includes('ja') || d.metadata.audioLanguages.includes('en')) {
            throw new Error(`Deco semantic audio should be Japanese only: ${JSON.stringify(d.metadata.audioLanguages)}`);
          }
          if (!Array.isArray(d.metadata.transportAudioLanguages) || !d.metadata.transportAudioLanguages.includes('en')) {
            throw new Error(`Expected upstream mislabeled English HLS transport tag for Deco: ${JSON.stringify(d.metadata.transportAudioLanguages)}`);
          }
          if (!d.streams.every(s => /[?&]audio=ja(?:&|$)/i.test(s.url || ''))) throw new Error('Deco playback URLs are not carrying semantic Japanese audio hint');
          console.log(`Deco semantic audio correction passed: variant=${d.metadata.audioVariant} audio=${d.metadata.audioLanguages.join(',')} transport=${d.metadata.transportAudioLanguages.join(',')} evidence=${d.metadata.audioEvidence}`);
          NODE

          PLAY_URL="$(BODY_FILE=/tmp/deco.json node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.BODY_FILE,'utf8'));
          const s=d.streams.find(x=>Number(x.height)===1080)||d.streams[0];
          process.stdout.write(s.url);
          NODE
          )"

          curl --fail --silent --show-error --max-time 30 "$PLAY_URL" > /tmp/deco-desktop.m3u8
          cat /tmp/deco-desktop.m3u8
          grep -q '#EXT-X-MEDIA:.*TYPE=AUDIO' /tmp/deco-desktop.m3u8
          grep -q '#EXT-X-MEDIA:.*TYPE=SUBTITLES' /tmp/deco-desktop.m3u8
          grep -q 'LANGUAGE="ja"' /tmp/deco-desktop.m3u8
          grep -q 'NAME="Japanese"' /tmp/deco-desktop.m3u8
          grep -q 'snd/a.m3u8' /tmp/deco-desktop.m3u8
          grep -q 's/en.vtt' /tmp/deco-desktop.m3u8
          test "$(grep -c '^#EXT-X-STREAM-INF:' /tmp/deco-desktop.m3u8)" = "1"

          curl -A 'ExoPlayerLib/1.5 (Linux;Android 15)' --fail --silent --show-error --max-time 30 "$PLAY_URL" > /tmp/deco-android.m3u8
          cat /tmp/deco-android.m3u8
          grep -q '#EXT-X-MEDIA:.*TYPE=AUDIO' /tmp/deco-android.m3u8
          grep -q 'LANGUAGE="ja"' /tmp/deco-android.m3u8
          grep -q 'NAME="Japanese"' /tmp/deco-android.m3u8
          grep -q 'snd/a.m3u8' /tmp/deco-android.m3u8
          if grep -q '#EXT-X-MEDIA:.*TYPE=SUBTITLES' /tmp/deco-android.m3u8; then
            echo 'Android HentaiHaven master still contains built-in subtitle group' >&2
            exit 1
          fi
          if grep -q 'SUBTITLES=' /tmp/deco-android.m3u8; then
            echo 'Android HentaiHaven variant still references subtitle group' >&2
            exit 1
          fi
          test "$(grep -c '^#EXT-X-STREAM-INF:' /tmp/deco-android.m3u8)" = "1"
