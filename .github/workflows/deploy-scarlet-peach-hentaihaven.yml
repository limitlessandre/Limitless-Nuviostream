name: Deploy Scarlet Peach HentaiHaven Worker

on:
  workflow_dispatch:
  push:
    branches:
      - scarlet-peach-providers
    paths:
      - 'workers/scarlet-peach-hentaihaven/**'
      - '.github/workflows/deploy-scarlet-peach-hentaihaven.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/scarlet-peach-hentaihaven
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Worker syntax
        run: |
          node --check src/router.js
          node --check src/router-v2.js

      - name: Deploy Worker
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Worker health and audio-only master mode
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            body="$(curl --fail --silent --show-error --max-time 15 https://scarlet-peach-hentaihaven.limitlessandre.workers.dev/health || true)"
            if printf '%s' "$body" | grep -q 'Scarlet Peach HentaiHaven Resolver' && \
               printf '%s' "$body" | grep -q '"version":"0.5.4"' && \
               printf '%s' "$body" | grep -q 'hentaihaven.vip' && \
               printf '%s' "$body" | grep -q '"audioTrackPreservation":true' && \
               printf '%s' "$body" | grep -q '"playbackTransport":"quality-scoped-audio-hls-master"' && \
               printf '%s' "$body" | grep -q '"subtitleTransport":"addon-resource"' && \
               printf '%s' "$body" | grep -q '"verifiedDubLabels":true'; then
              printf '%s\n' "$body"
              break
            fi
            echo "Waiting for v0.5.4 propagation (attempt ${attempt})"
            if [ "$attempt" = 8 ]; then
              echo 'Worker health/version check failed' >&2
              printf '%s\n' "$body" >&2
              exit 1
            fi
            sleep 3
          done

      - name: Probe HentaiHaven video plus audio manifests
        run: |
          set -euo pipefail

          resolve() {
            name="$1"
            payload="$2"
            expected_backend="$3"
            curl --fail --silent --show-error --max-time 90 \
              -X POST https://scarlet-peach-hentaihaven.limitlessandre.workers.dev/resolve \
              -H 'content-type: application/json' \
              --data "$payload" > "/tmp/${name}.json"
            NAME="$name" EXPECTED_BACKEND="$expected_backend" node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(`/tmp/${process.env.NAME}.json`, 'utf8'));
          if (d.backend !== process.env.EXPECTED_BACKEND) throw new Error(`${process.env.NAME}: backend=${d.backend}`);
          if (d.version !== '0.5.4') throw new Error(`${process.env.NAME}: version=${d.version}`);
          if (d.playbackTransport !== 'quality-scoped-audio-hls-master') throw new Error(`${process.env.NAME}: wrong transport`);
          if (!d.audioTrackPreservation) throw new Error(`${process.env.NAME}: audio preservation missing`);
          if (!Array.isArray(d.streams) || !d.streams.length) throw new Error(`${process.env.NAME}: no streams`);
          if (!d.streams.every(s => /scarlet-peach-hentaihaven\.limitlessandre\.workers\.dev\/play\.m3u8/i.test(String(s.url || '')))) {
            throw new Error(`${process.env.NAME}: HLS stream did not use audio master`);
          }
          if (!d.metadata || !Array.isArray(d.metadata.subtitleTracks) || !d.metadata.subtitleTracks.some(s => String(s.language || '').toLowerCase() === 'en')) {
            throw new Error(`${process.env.NAME}: English subtitle metadata missing`);
          }
          console.log(`${process.env.NAME}: ${d.streams.map(s => `${s.height}p/${s.codec}`).join(', ')}`);
          NODE
          }

          resolve com-known '{"title":"Soshite Watashi wa Sensei ni","episode":1}' com
          resolve vip-jimihen '{"title":"Jimihen!!: Jimiko wo Kaechau Jun Isei Kouyuu!!","aliases":["Jimihen!! Jimiko o Kae Chau Jun Isei Kouyuu"],"episode":1}' vip
          resolve deco '{"title":"Deco x Deco The Animation","episode":1}' com

          for height in 720 1080; do
            PLAY_URL="$(HEIGHT="$height" node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('/tmp/deco.json','utf8'));
          const s=d.streams.find(x=>Number(x.height)===Number(process.env.HEIGHT));
          if (!s) process.exit(2);
          process.stdout.write(s.url);
          NODE
            )"
            echo "===== ${height}p audio master ====="
            curl --fail --silent --show-error --max-time 30 "$PLAY_URL" > "/tmp/deco-${height}.m3u8"
            cat "/tmp/deco-${height}.m3u8"
            grep -q '#EXT-X-MEDIA:.*TYPE=AUDIO' "/tmp/deco-${height}.m3u8"
            grep -q 'snd/a.m3u8' "/tmp/deco-${height}.m3u8"
            test "$(grep -c '^#EXT-X-STREAM-INF:' "/tmp/deco-${height}.m3u8")" = "1"
            if grep -Eq '#EXT-X-MEDIA:.*TYPE=(SUBTITLES|CLOSED-CAPTIONS)|SUBTITLES=|CLOSED-CAPTIONS=' "/tmp/deco-${height}.m3u8"; then
              echo "${height}p playback master leaked subtitle directives" >&2
              exit 1
            fi

            AUDIO_URL="$(sed -n 's/.*TYPE=AUDIO.*URI="\([^"]*\)".*/\1/p; s/.*URI="\([^"]*\)".*TYPE=AUDIO.*/\1/p' "/tmp/deco-${height}.m3u8" | head -1)"
            VIDEO_URL="$(awk '!/^#/ && NF {line=$0} END {print line}' "/tmp/deco-${height}.m3u8")"
            test -n "$AUDIO_URL"
            test -n "$VIDEO_URL"
            echo "audio child: $AUDIO_URL"
            echo "video child: $VIDEO_URL"
            curl --fail --silent --show-error --max-time 30 "$AUDIO_URL" > "/tmp/deco-${height}-audio.m3u8"
            curl --fail --silent --show-error --max-time 30 "$VIDEO_URL" > "/tmp/deco-${height}-video.m3u8"
            grep -q '#EXTM3U' "/tmp/deco-${height}-audio.m3u8"
            grep -q '#EXTM3U' "/tmp/deco-${height}-video.m3u8"
          done
