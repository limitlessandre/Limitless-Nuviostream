name: Cleanup temporary AniDB tooling

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-anidb-temp.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary AniDB research/deploy files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/inspect-eclipsia.yml \
            .github/workflows/deploy-anidb-praxiel.yml \
            .github/workflows/trigger-anidb-import.yml \
            .github/workflows/cleanup-anidb-temp.yml \
            .eclipsia-inspection.txt \
            .eclipsia-stable-manifest.json \
            .praxiel-source.js \
            .anidb-praxiel-v1.0.2.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Clean temporary AniDB tooling [skip ci]"
            git push origin HEAD:main
          fi

      - name: Close temporary AniDB diagnostic issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue close 2 --repo "${{ github.repository }}" --comment "AniDB Praxiel baseline has been deployed to Limitless-Nuviotest; closing temporary diagnostic issue." || true
